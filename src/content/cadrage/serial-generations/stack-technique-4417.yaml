# Réponse au mail d'Isabelle du 2026-09-15, 09:39 : sa question sur
# l'autonomie de gestion, et une remarque transmise par son collègue
# (favorable à un hébergement WordPress plutôt qu'au site sur mesure du
# devis déjà envoyé).
#
# Le collègue parle d'un hébergement type OVH avec WordPress auto-hébergé
# (gratuit, open source), pas de WordPress.com. Son nom et son manque de
# suivi restent hors document : lecture interne, jamais transmissible.
#
# Sort du cas d'usage documenté du mode cadrage (il part après un prix
# ferme, devis V2 à 2 090,40 € TTC envoyé le 2026-09-14, pas avant), utilisé
# quand même pour son tableau comparatif. Signalé à Ludo.
#
# Chiffre Core Web Vitals (Astro 71 %, WordPress 48 %) : astro.build,
# section « Astro Islands », source HTTP Archive / Chrome UX Report.
#
# Vidéo : la Fireship (v1) et les deux vidéos proposées par Ludo ensuite
# (Adam Lowe, Chris Good) écartées après vérification de leur description
# officielle, toutes trois plus techniques que voulu (public agences
# WordPress ou outils de page-building). Retenue : « Sanity Studio How-To
# for Content Editors », Dinghy Studio, explicitement « for users
# transitioning from platforms like WordPress ».
#
# Révision du 2026-09-15 sur retour de Ludo : « pas en théorie » supprimé,
# et tout le texte repris au style lapidaire (une idée par phrase, aucune
# formule de transition).
titre: WordPress ou le site que je te propose
objet: Ta question sur l'autonomie, et la remarque de ton collègue
date: 2026-09-15
contact: Isabelle
tutoiement: true
linear:
  projet: Sérial Générations
  affaire: CRM-91

intro:
  - titre: Sur l'autonomie
    texte: >-
      Oui, tu gardes la main. Tu ajoutes une actualité, un membre de
      l'équipe, un partenaire, une vidéo. Sans repasser par moi. C'est déjà
      dans le devis, pas une option en plus.
  - titre: Sur la remarque de ton collègue
    texte: >-
      Sa question est légitime : pourquoi payer un prestataire plutôt qu'un
      hébergement WordPress avec votre nom de domaine ? Le tableau ci-dessous
      compare les deux sur votre cas.
  - titre: Sur le site actuel
    texte: >-
      Le site actuel est un Blogger, pas un WordPress. Une plateforme de
      blog, pas un site de projet de recherche. Le retravailler n'y change
      rien : pas de page Équipe ou Partenaires à part, vidéos limitées à
      YouTube.
  - titre: La stack que je te propose
    texte: >-
      Quatre outils. Les comptes (hébergement, contenu) sont à ton nom, pas
      au mien.
    liste:
      - texte: >-
          **[Astro](https://astro.build)** construit le site. 71 % des sites
          Astro passent les Core Web Vitals, contre 48 % pour WordPress
          (Chrome UX Report) : il n'envoie que le nécessaire au navigateur.
      - texte: >-
          **[Sanity Studio](https://www.sanity.io)** est ton espace de
          rédaction. Gratuit à votre échelle de trafic. À toi : le compte
          est à ton nom, exportable si tu changes de prestataire.
      - texte: >-
          **[Cloudflare](https://www.cloudflare.com)** héberge le site.
          Gratuit à ce volume de trafic, sans abonnement.
      - texte: >-
          **[Tailwind CSS](https://tailwindcss.com)** met le site en forme,
          cohérente sur toutes les pages.
    note: >-
      Jeu de données complet : [httparchive.org](https://httparchive.org/reports/techreport/tech?client=mobile&tech=Astro,WordPress,Gatsby,Next.js,Nuxt.js&geo=ALL&rank=ALL&page=1).
  - titre: L'espace de rédaction, en vidéo
    texte: >-
      Cette vidéo montre Sanity Studio côté rédacteur, pas côté code. Pensée
      pour des gens qui viennent de WordPress. L'écran que tu y vois, c'est
      tout ce que verra ton équipe : actualités, équipe, partenaires,
      vidéos. Rien d'autre.
    video:
      id: GLmcyRUqHdY
      titre: "Sanity Studio pour les rédacteurs, par Dinghy Studio"
    note: >-
      Pour aller plus loin : le retour d'une agence passée de WordPress à
      Astro, [chez Contentious](https://contentious.ltd/resources/how-and-why-to-move-from-wordpress-to-astro).

comparatif:
  titre: WordPress ou le site que je te propose
  texte: >-
    Les deux permettent de publier seul. La différence : le coût réel dans
    le temps, et qui porte la maintenance.
  solutions:
    - nom: WordPress auto-hébergé
      resume: Hébergement type OVH, WordPress (gratuit, open source), géré par vous.
    - nom: Le site que je te propose
      resume: Astro, Sanity et Cloudflare, livré clé en main.
      recommandee: true
  criteres:
    - label: Coût de départ
      valeurs:
        - >-
          WordPress est gratuit. Mais il faut l'hébergement, souvent un
          thème payant, les extensions vidéo et sécurité, et le temps de
          tout configurer
        - >-
          1 950 € TTC (devis déjà transmis) : six pages, espace de
          rédaction, mise en ligne compris
    - label: Coût chaque année
      valeurs:
        - >-
          Hébergement à renouveler, 31 à 72 € HT par an chez OVH (pack
          Starter à Perso), plus le nom de domaine
        - Rien. Seul le nom de domaine, déjà à vous, se renouvelle comme aujourd'hui
    - label: Qui gère les mises à jour et la sécurité
      valeurs:
        - >-
          Vous, ou quelqu'un que vous payez. WordPress est le logiciel de
          site le plus ciblé au monde, souvent faute de mises à jour
        - >-
          Personne. Ni extension ni base de données à sécuriser : le site
          est reconstruit à chaque publication
    - label: Autonomie au quotidien
      valeurs:
        - >-
          Oui, avec un tableau de bord généraliste, pensé pour tous les
          usages (blog, boutique, forum…), pas pour le vôtre
        - >-
          Oui, avec un espace pensé uniquement pour vos actualités, votre
          équipe, vos partenaires et vos vidéos
    - label: Vitesse et référencement
      valeurs:
        - Dépend du thème et des extensions installées, se dégrade avec leur nombre
        - Optimisé dès la mise en ligne, sans extension inutile
    - label: À qui appartiennent les comptes
      valeurs:
        - "À vous : hébergeur et WordPress ouverts et administrés à votre nom"
        - >-
          À vous aussi : Cloudflare et Sanity sont à votre nom. Rien n'est
          verrouillé chez Coolbeans
  mentionCout: >-
    Montants WordPress à titre indicatif, selon l'hébergeur. Le prix du
    site sur mesure est ferme : celui du devis du 14 septembre.

questions: []

