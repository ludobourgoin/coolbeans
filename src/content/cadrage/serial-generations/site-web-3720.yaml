# Cadrage du site de Sérial'Générations. Affaire CRM-91.
#
# Origine : mail d'Isabelle Tournier le 2026-09-10, après une conversation de vive
# voix la veille. Maîtresse de conférences en neuropsychologie au laboratoire
# EPSYLON, Université Paul-Valéry Montpellier 3, amie de Ludo.
#
# Révision du 2026-09-10, sur retour de Ludo. Trois coupes :
#   - la section « Pourquoi ce document » : un titre dit ce que la section
#     contient, il ne justifie pas son existence ;
#   - le tableau comparatif des trois voies : refusé en bloc. Ce qui décrivait la
#     colonne « site sur mesure » est passé en « Ce que j'ai compris » ;
#   - la question sur le circuit d'achat : hors sujet à ce stade.
#
# Alerte issue du retex Osmose : même fourchette annoncée, 1 500 à 2 000 €, et
# Osmose a refusé à 1 748 € en restant dedans. La fourchette plafonne le projet,
# elle n'autorise pas à le remplir. D'où l'ordre de grandeur en note plutôt qu'un
# prix : sans aucun chiffre, le lead ancre lui-même et il ancre haut (retex Vice
# Versa du 2026-08-27).
#
# Tutoiement, comme son mail. Le formulaire, lui, est vouvoyé : c'est un composant
# partagé par tous les clients.
titre: Le site de Sérial'Générations
objet: Cinq questions avant de te dire ce que ça coûte
date: 2026-09-10
contact: Isabelle
linear:
  affaire: CRM-91

intro:
  - titre: Ce que j'ai compris
    texte: >-
      Tu veux un site qui fasse plus professionnel sans perdre le grand public.
    liste:
      - texte: >-
          **Un site dessiné pour Sérial'Générations**, lisible par les chercheurs
          comme par les spectateurs des séries.
      - texte: >-
          **Un espace d'administration** où tu gères tes actualités, tes
          publications et tes événements sans passer par moi.
      - texte: >-
          **Tes captations sur Pod**, intégrées aux pages, et tes PDF classés par
          thème.
      - texte: >-
          **Quatre à six semaines** de production, une fois le contenu réuni.
    note: >-
      Ordre de grandeur pour ce périmètre : 1 500 à 2 500 € une fois, puis rien.
      Hébergement gratuit, aucun abonnement. Le prix ferme vient après tes
      réponses. Si tu préfères qu'on en parle de vive voix, dis-le moi et on cale
      un créneau.

questions:
  - id: budget
    label: Tes 1 500 à 2 000 €, c'est hors taxes ou toutes taxes comprises ?
    aide: >-
      Un laboratoire ne récupère pas la TVA, donc il raisonne souvent en TTC.
      Entre les deux réponses, l'écart vaut 20 % de ce que je peux mettre dans le
      site.
    type: choix
    decisif: true
    requis: true
    options:
      - valeur: ht
        label: Hors taxes
        aide: La TVA vient en plus, la facture monte à 2 400 € au maximum.
      - valeur: ttc
        label: Toutes taxes comprises
        aide: La facture ne dépasse pas 2 000 €, TVA incluse.
      - valeur: verifie
        label: Je vérifie auprès de la gestion et je te le dis

  - id: contenu
    label: Les textes du site actuel, on les reprend tels quels ou on les réécrit ?
    aide: >-
      C'est le poste qui bouge le plus. Reprendre tes textes en les nettoyant
      tient dans ton budget. Les réécrire pour parler au grand public est un
      travail à part, et il se chiffre à part.
    type: choix
    decisif: true
    requis: true
    options:
      - valeur: reprise
        label: On reprend mes textes, je m'occupe des corrections
        aide: Le montage le plus économique des trois.
      - valeur: structure
        label: On garde la structure, mais il faut réécrire pour le grand public
      - valeur: neuf
        label: Presque tout est à écrire

  - id: contraintes
    label: Ton université impose-t-elle quelque chose sur le site du projet ?
    aide: >-
      La troisième pèse lourd : l'accessibilité RGAA est une obligation légale
      pour les établissements publics, avec une déclaration à publier. Demandée à
      la lettre, elle ne tient pas dans ton budget.
    type: choix
    decisif: true
    requis: true
    multiple: true
    autre: true
    options:
      - { valeur: charte, label: "Une charte graphique à respecter" }
      - { valeur: hebergement, label: "Un hébergement chez les services informatiques" }
      - { valeur: rgaa, label: "L'accessibilité RGAA et sa déclaration" }
      - { valeur: libre, label: "Rien de tout ça, le projet est libre de ses choix" }
      - { valeur: inconnu, label: "Je ne sais pas, je me renseigne" }

  - id: videos
    label: Tes captations et tes micros-trottoirs, tu comptes les mettre où ?
    aide: >-
      Tu as déjà un accès à Pod, la plateforme vidéo de l'enseignement supérieur.
      C'est gratuit, ça dure au-delà du projet, et le site sait afficher ces
      vidéos dans ses pages. Les autres solutions coûtent, en argent ou en
      publicité.
    type: choix
    options:
      - { valeur: pod, label: "Sur Pod, la plateforme de l'université" }
      - { valeur: youtube, label: "Sur YouTube ou Vimeo" }
      - { valeur: inconnu, label: "Je ne sais pas encore" }

  - id: echeance
    label: Une date à tenir ?
    aide: >-
      Si une échéance commande la mise en ligne, dis-la maintenant : elle change
      l'ordre dans lequel je travaille.
    type: texte
    long: true
    placeholder: Fin de financement, colloque, table ronde, campagne de recrutement

notes:
  - tone: info
    texte: Tes réponses arrivent dans ma boîte mail, et tu en reçois une copie.
  - tone: info
    texte: >-
      Deux choses hors périmètre. Les réseaux sociaux : le site est préparé pour
      qu'un partage sur Facebook ou Instagram s'affiche avec son titre, son texte
      et son image, mais l'ouverture des comptes et leur animation restent chez
      vous. Le montage des captations : je les intègre au site, je ne les monte
      pas.
