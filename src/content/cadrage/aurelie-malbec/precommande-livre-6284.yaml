# Cadrage de la précommande du livre d'Aurélie Malbec. Affaire CRM-95.
#
# Origine : WhatsApp du 2026-09-15. Aurélie a déjà un compte PayPal ; c'est
# Ludo qui lui a parlé de PayPal ET de Stripe comme solutions possibles pour
# encaisser en ligne, pas elle. Ce document détaille les deux pour qu'elle
# tranche, avec un simulateur pour rendre le pourcentage concret sur son
# prix à elle plutôt que sur un exemple abstrait.
#
# Aucune des deux solutions n'est recommandée dans le tableau, sur demande
# explicite de Ludo le 2026-09-15 : Stripe convertit mieux (paiement sans
# quitter le site), PayPal rassure par familiarité, et seule Aurélie sait
# quel critère pèse le plus pour ses lecteurs.
#
# La question "bouton simple ou vraie boutique" a été retirée : c'est
# tranché, la page est un ajout simple dans la nav principale. La section
# d'accueil optionnelle (meilleure conversion que le seul header) est un
# sujet de proposition, pas de cadrage : elle partira en option cochable au
# chiffrage, pas ici.
#
# Tutoiement, comme leurs échanges WhatsApp.
titre: La précommande de ton livre en ligne
objet: Quelques questions avant de te faire une proposition
date: 2026-09-15
contact: Aurélie
tutoiement: true
linear:
  affaire: CRM-95

intro:
  - titre: Ce que j'ai compris
    texte: >-
      Tu veux ouvrir la précommande de ton livre sur ton site, plutôt que de
      passer par une plateforme payante. Je t'ai parlé de deux solutions pour
      encaisser en ligne, PayPal et Stripe. Voici ce qui les distingue
      concrètement, pour que tu choisisses en connaissance de cause.
    note: >-
      Tu vises début octobre pour lancer la précommande. Si tu préfères qu'on
      en parle de vive voix, dis-le moi et on cale un créneau.

comparatif:
  titre: PayPal ou Stripe
  texte: >-
    Ce que chacun te prend sur une vente, et ce que ça change pour toi et pour
    tes lecteurs. Aucune des deux n'est un choix par défaut : ça dépend de qui
    t'achète le livre.
  solutions:
    - nom: PayPal
      resume: Le bouton que tu connais déjà, et que tu as toi-même.
      fraisPourcentage: 2.9
      fraisFixe: 0.35
    - nom: Stripe
      resume: >-
        Un formulaire de carte bancaire directement sur ton site, sans compte
        à créer.
      fraisPourcentage: 1.5
      fraisFixe: 0.25
  criteres:
    - label: Commission en France et en Europe
      valeurs:
        - "2,90 % + 0,35 € par vente"
        - "1,5 % + 0,25 € par vente"
    - label: Commission hors Europe
      valeurs:
        - "+ 1,99 %"
        - "3,15 % + 0,25 €, + 2 % en cas de conversion"
    - label: En cas de litige avec un acheteur
      valeurs:
        - "14 €"
        - "20 €"
    - label: Au moment de payer
      valeurs:
        - "Ton lecteur clique sur un bouton PayPal connu, mais quitte ton site le temps du paiement."
        - "Ton lecteur paie par carte sans quitter ta page. Moins d'étapes, souvent moins d'abandons."
    - label: Mise en place
      valeurs:
        - "Tu as déjà un compte, à passer en professionnel."
        - "Un compte à créer, un lien de paiement suffit pour démarrer."
  mentionCout: >-
    Ordres de grandeur donnés avant tes réponses, relevés en septembre 2026
    sur les grilles tarifaires officielles de Stripe et PayPal.
  simulateur:
    titre: Ce qu'il te reste sur chaque vente
    prixDefaut: 20
    prixMin: 5
    prixMax: 60

questions:
  - id: moyen-paiement
    label: PayPal ou Stripe, tu penches pour lequel ?
    aide: >-
      Reporte-toi au tableau et au simulateur ci-dessus. Rien ne t'empêche
      non plus de proposer les deux à tes lecteurs.
    type: choix
    decisif: true
    requis: true
    options:
      - valeur: paypal
        label: PayPal, je pars avec ce que j'ai déjà
        aide: Colonne 1 du tableau.
      - valeur: stripe
        label: Stripe, je préfère la carte bancaire directe
        aide: Colonne 2 du tableau.
      - valeur: les-deux
        label: Les deux, je laisse le choix à mes lecteurs
      - valeur: indecis
        label: Je ne sais pas encore, j'aimerais qu'on en parle

  - id: support
    label: Ton livre est en papier, en numérique, ou les deux ?
    aide: Ça change ce qu'on demande à l'achat, une adresse de livraison ou pas.
    type: choix
    options:
      - valeur: papier
        label: Papier
      - valeur: numerique
        label: Numérique
      - valeur: les-deux
        label: Les deux

  - id: budget
    label: Quel ordre de grandeur peux-tu y consacrer ?
    aide: >-
      Ça décide aussi qui écrit le texte de la page. En dessous d'un certain
      budget, tu m'envoies ton texte final tel qu'il doit apparaître, et je
      le mets en ligne tel quel, sans le retravailler. Au-dessus, c'est moi
      qui l'écris, à partir de tes réponses à quelques questions sur le
      livre : un texte pensé pour donner envie d'acheter, pas juste posé sur
      la page. Réponds franchement, y compris "je ne sais pas".
    type: choix
    decisif: true
    requis: true
    options:
      - valeur: sous-300
        label: Moins de 300 €
        aide: >-
          La mise en place technique. Tu m'envoies ton texte final, je le
          mets en ligne sans l'optimiser.
      - valeur: 300-600
        label: De 300 à 600 €
        aide: >-
          La technique, plus un texte écrit pour convertir, à partir de tes
          réponses à quelques questions sur le livre.
      - valeur: plus-600
        label: Plus de 600 €
        aide: Comme la fourchette précédente, avec plus de place pour itérer.
      - valeur: inconnu
        label: Je ne sais pas encore

notes:
  - tone: info
    texte: >-
      Tes réponses arrivent dans ma boîte mail, et tu en reçois une copie.
      Rien n'est facturé.
  - tone: warning
    texte: >-
      Avant de vendre, un point à régler : un compte PayPal personnel ne
      suffit pas, et un paiement "entre proches" ne protège ni toi ni
      l'acheteur. Dans les deux cas il faut un statut professionnel
      (micro-entreprise, artiste-auteur...) pour encaisser. À vérifier avec
      l'URSSAF ou un comptable.
