# Premier document de cadrage du format (COO-188, COO-191).
#
# Origine : WhatsApp de Nathalie le 2026-09-05, tracé en SET-16. Demande hors
# périmètre de la refonte, donc facturable, mais trop floue pour être chiffrée :
# « réserver avec un nombre maximal » et « une alerte de liste d'attente »
# recouvrent trois solutions de tailles très différentes.
#
# D'où ce document plutôt qu'un rendez-vous : Nathalie n'a jamais dit de budget
# sur ce sujet, et un appel d'une heure pour découvrir qu'il n'y en a pas est
# une heure perdue pour tout le monde.
#
# Version raccourcie le 2026-09-08 : la première rédaction était trop longue.
# Ce qui a sauté (gêne principale, cours concernés, suivi actuel, règle
# d'annulation) se demande de vive voix au moment du chiffrage.
#
# Réécriture du 2026-09-10, sur trois demandes de Ludo :
#
# 1. AUCUN PRIX. Les deux lignes de coût du tableau sont retirées, ainsi que
#    toute allusion chiffrée. Le tableau compare ce que chaque solution change
#    pour elle et pour ses élèves, pas ce qu'elle coûte. La question du budget
#    reste : c'est SON chiffre à elle, pas une annonce de prix.
# 2. Le bloc d'intro dit ce que j'ai compris de son besoin, au lieu d'expliquer
#    à quoi sert le document.
# 3. Plus court et plus simple. Nathalie a près de soixante ans et ne connaît
#    rien au web : pas de vocabulaire de métier, des phrases qu'on dirait à
#    l'oral, et rien qu'elle doive relire deux fois.
#
# Tutoiement de bout en bout depuis le 2026-09-10, formulaire compris
# (`tutoiement: true`), comme sur sa proposition commerciale.
titre: La réservation en ligne de tes cours
objet: Cinq questions avant de te faire une proposition
date: 2026-09-05
contact: Nathalie
tutoiement: true
linear:
  projet: Refonte site Internet
  demande: SET-16

intro:
  - titre: Ton besoin comme je l'ai compris
    texte: >-
      Tu as parfois trop de monde à tes cours. Tu voudrais limiter le nombre de
      places, et prévenir les gens dès qu'une place se libère. Il y a trois
      façons de le faire, et elles ne demandent pas le même travail.
    note: >-
      Si tu préfères qu'on en parle de vive voix, dis-le moi et on cale un
      créneau.

comparatif:
  titre: Les trois façons
  texte: Regarde ce que chacune change pour toi, et pour tes élèves.
  solutions:
    - nom: Tu gardes la main
      resume: Le site affiche « complet ». Tu gères les inscriptions comme aujourd'hui.
    - nom: Un outil de réservation
      resume: Un service extérieur, ajouté à ton site. Il compte les places à ta place.
      recommandee: true
    - nom: Tout dans ton site
      resume: Ton site compte les places lui-même, sans rien d'extérieur.
  criteres:
    - label: Ce que tu fais
      valeurs:
        - Tu coches les cours complets. Deux minutes.
        - Rien de plus qu'aujourd'hui, une fois ton planning saisi.
        - Rien de plus qu'aujourd'hui.
    - label: Ce que font tes élèves
      valeurs:
        - Ils voient « complet », et ils s'inscrivent auprès de toi.
        - Ils réservent depuis leur téléphone et reçoivent un mail de confirmation.
        - Ils réservent sans quitter ton site.
    - label: La liste d'attente
      valeurs:
        - Tu notes les noms toi-même.
        - La place libérée revient au premier de la liste, toute seule.
        - Automatique, et réglée comme tu veux.
    - label: Ce qui peut coincer
      valeurs:
        - Si tu oublies de cocher, le site annonce une place qui n'existe plus.
        - Les élèves les moins à l'aise avec le web peuvent renoncer.
        - C'est un second projet, aussi gros que ton site.
  mentionCout: >-
    Si un point n'est pas clair, dis-le moi. On en reparle avant que je te
    propose quoi que ce soit.

questions:
  - id: mode
    label: >-
      Tu préfères que tes élèves réservent eux-mêmes, ou que le site affiche
      seulement « complet » ?
    aide: >-
      C'est la question qui compte le plus. Afficher « complet » est simple à
      mettre en place. Faire réserver tes élèves est un vrai projet.
    type: choix
    decisif: true
    requis: true
    options:
      - { valeur: reservent, label: Mes élèves réservent eux-mêmes }
      - { valeur: garde-main, label: Le site affiche « complet », je garde la main }
      - { valeur: indecis, label: Je ne sais pas encore, j'aimerais qu'on en parle }

  - id: rythme
    label: Tes élèves viennent au trimestre, à la carte, ou séance par séance ?
    aide: >-
      Un élève inscrit au trimestre a déjà sa place. Un élève à la séance la
      prend au moment où il réserve. Ce n'est pas la même chose à construire.
    type: choix
    decisif: true
    requis: true
    autre: true
    options:
      - { valeur: trimestre, label: Plutôt au trimestre }
      - { valeur: carte, label: Plutôt à la carte }
      - { valeur: seance, label: Plutôt séance par séance }
      - { valeur: melange, label: Un peu des trois }

  - id: places
    label: Quels cours, et combien de places au maximum ?
    aide: >-
      Une réponse approximative suffit. Dis-moi si le nombre de places change
      d'un cours à l'autre.
    type: texte
    long: true
    requis: true
    placeholder: Les cours concernés, et le nombre de places

  - id: aisance
    label: Tes élèves sont-ils à l'aise avec un site web ?
    aide: >-
      Sans détour : si une partie d'entre eux ne réserve jamais en ligne, tu te
      retrouves avec deux systèmes à tenir au lieu d'un.
    type: choix
    options:
      - { valeur: alaise, label: Oui, dans l'ensemble }
      - { valeur: mixte, label: Une partie oui, une partie non }
      - { valeur: telephone, label: Non, c'est plutôt téléphone et WhatsApp }

  - id: budget
    label: Quel ordre de grandeur peux-tu y consacrer ?
    aide: >-
      Réponds franchement, y compris « je ne sais pas ». Ça sert à ne pas te
      proposer quelque chose que tu ne prendras pas.
    type: choix
    decisif: true
    requis: true
    options:
      - { valeur: sous-500, label: Moins de 500 € }
      - { valeur: 500-1000, label: De 500 à 1 000 € }
      - { valeur: 1000-3000, label: De 1 000 à 3 000 € }
      - { valeur: plus-3000, label: Plus de 3 000 € }
      - { valeur: inconnu, label: Je ne sais pas encore }

notes:
  - tone: info
    texte: >-
      Tes réponses arrivent dans ma boîte mail, et tu en reçois une copie. Rien
      n'est facturé.
