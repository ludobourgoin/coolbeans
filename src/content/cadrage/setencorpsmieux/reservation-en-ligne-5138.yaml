# Premier document de cadrage du format (COO-188, COO-191).
#
# Origine : WhatsApp de Nathalie le 2026-09-05, tracé en SET-16. Demande hors
# périmètre de la refonte, donc facturable, mais trop floue pour être chiffrée :
# « réserver avec un nombre maximal » et « une alerte de liste d'attente »
# recouvrent trois solutions dont les coûts vont de un à dix.
#
# D'où ce document plutôt qu'un rendez-vous : Nathalie n'a jamais dit de budget
# sur ce sujet, et un appel d'une heure pour découvrir qu'il n'y en a pas est
# une heure perdue pour tout le monde.
#
# Tutoiement, comme sur sa proposition commerciale (site-internet-7402.yaml).
# Le formulaire, lui, est vouvoyé : c'est un composant partagé par tous les
# clients. Elle a déjà vu ce mélange sur son devis.
titre: La réservation en ligne de tes cours
objet: Quelques questions avant de te dire ce que ça coûte
date: 2026-09-05
contact: Nathalie
linear:
  projet: Refonte site Internet
  demande: SET-16

intro:
  - titre: Pourquoi ce document
    texte: >-
      Tu m'as demandé s'il était possible d'ajouter une réservation avec un
      nombre de places maximum et une alerte de liste d'attente. La réponse est
      oui, mais il y a plusieurs façons de le faire, et elles ne coûtent pas du
      tout la même chose.
    liste:
      - texte: >-
          **Ça ne t'engage à rien.** Rien n'est facturé, rien n'est lancé. Tu
          réponds, je chiffre.
      - texte: >-
          **Dix minutes suffisent.** Neuf questions, dont trois qui décident
          vraiment du prix.
      - texte: >-
          **Je te réponds honnêtement.** Si la solution la moins chère suffit,
          c'est celle que je te proposerai.
    note: >-
      Ce que tu me dis ici remplace un rendez-vous. Si tu préfères qu'on en
      parle de vive voix, dis-le moi et on cale un créneau.

  - titre: Ce que ça implique
    texte: >-
      Ton site est aujourd'hui un site statique : il affiche des pages, il ne
      retient rien. Faire réserver quelqu'un, c'est autre chose. Il faut garder
      en mémoire qui a pris quelle place, envoyer des mails de confirmation, et
      te donner un écran pour gérer tout ça.
    liste:
      - texte: >-
          Afficher « complet » sur un cours est **simple** : c'est une
          information que tu poses toi-même, comme un texte ou une photo.
        tooltip: >-
          Concrètement, une case à cocher dans ton espace d'administration, à
          côté de chaque cours du planning.
      - texte: >-
          Faire **compter les places par le site** est un vrai projet : il faut
          une base de données, des mails automatiques et une page de gestion.
      - texte: >-
          Entre les deux, il existe des **services tout faits** pour les cours
          collectifs, qu'on branche au site sans rien construire.

comparatif:
  titre: Les trois voies
  texte: >-
    Trois façons de répondre à ton besoin, de la plus légère à la plus lourde.
    Lis les lignes « ce que ça coûte » avant de répondre aux questions : c'est
    ce qui te permettra de choisir entre ce dont tu rêves et ce que tu veux y
    mettre.
  solutions:
    - nom: Tu gardes la main
      resume: Le site affiche « complet », tu tiens tes inscriptions comme aujourd'hui.
    - nom: Un service de réservation
      resume: Un outil extérieur branché à ton site, qui compte les places à ta place.
      recommandee: true
    - nom: Sur mesure dans ton site
      resume: Tout se passe chez toi, réservation, jauge et liste d'attente comprises.
  criteres:
    - label: Pour toi
      valeurs:
        - >-
          Tu coches les cours complets quand ils le deviennent. Tu continues de
          noter tes inscriptions comme tu le fais.
        - >-
          L'outil compte les places et te prévient quand un cours est plein. Tu
          retrouves tous tes inscrits au même endroit.
        - >-
          Un écran de gestion fait pour ta façon de travailler, dans ton propre
          espace d'administration.
    - label: Pour tes élèves
      valeurs:
        - >-
          Ils voient « complet » avant de se déplacer, et ils s'inscrivent
          auprès de toi comme d'habitude.
        - >-
          Ils réservent depuis leur téléphone et reçoivent une confirmation par
          mail.
        - >-
          Ils réservent sans quitter ton site, dans la même mise en page que le
          reste.
    - label: Liste d'attente
      valeurs:
        - Aucune. Tu notes les noms de ton côté.
        - "Automatique : une place libérée part au premier de la liste."
        - Automatique, et réglée exactement comme tu veux.
    - label: Ton travail chaque semaine
      valeurs:
        - Cocher les cours complets quand ça change. Deux minutes.
        - Rien de plus qu'aujourd'hui, une fois ton planning saisi.
        - Rien de plus qu'aujourd'hui.
    - label: À installer
      tooltip: >-
        C'est mon temps de travail, facturé une seule fois. Les fourchettes
        sont larges tant que je ne connais pas le détail de ton besoin.
      valeurs:
        - Environ 300 à 500 €
        - Environ 500 à 900 €
        - Environ 3 000 à 5 000 €
    - label: Tous les mois
      valeurs:
        - Rien.
        - >-
          Environ 30 € d'abonnement, avec une formule gratuite pour commencer.
        - >-
          Rien, mais un entretien technique à prévoir une fois par an.
    - label: Le risque
      valeurs:
        - >-
          Si tu oublies de cocher, ton site annonce une place qui n'existe
          plus.
        - >-
          Tes élèves les moins à l'aise avec le web peuvent renoncer à
          réserver.
        - >-
          C'est un second projet, de la taille de ton site. Long, et il faut me
          rappeler à chaque évolution.
  mentionCout: >-
    Ces montants sont des ordres de grandeur, donnés avant de connaître tes
    réponses, pour t'aider à situer les trois voies l'une par rapport à
    l'autre. Le prix ferme vient après, et il figurera dans une proposition en
    bonne et due forme.

questions:
  - id: gene
    label: Aujourd'hui, qu'est-ce qui te gêne le plus ?
    type: choix
    requis: true
    autre: true
    options:
      - { valeur: salle-pleine, label: Il y a trop de monde dans la salle }
      - { valeur: messages, label: Je passe trop de temps à répondre aux messages }
      - { valeur: deplacements, label: Des gens se déplacent alors que c'est complet }

  - id: cours-concernes
    label: Quels cours sont concernés, et à peu près combien de fois par mois sont-ils pleins ?
    aide: >-
      Une réponse approximative suffit. « Le Pilates du mardi soir, deux ou
      trois fois par mois » est parfait.
    type: texte
    long: true
    requis: true
    placeholder: Les cours concernés, et à quelle fréquence ils affichent complet

  - id: places
    label: Combien de places au maximum par cours, et est-ce le même nombre partout ?
    aide: >-
      Si la jauge change selon la salle ou selon l'activité, dis-le moi : ça
      change la façon de construire.
    type: texte
    long: true
    requis: true
    placeholder: Le nombre de places, et s'il varie d'un cours à l'autre

  - id: suivi-actuel
    label: Aujourd'hui, comment sais-tu qui vient ?
    aide: Plusieurs réponses possibles.
    type: choix
    multiple: true
    autre: true
    options:
      - { valeur: tete, label: De tête }
      - { valeur: cahier, label: Un cahier ou un carnet }
      - { valeur: messages, label: Les messages, WhatsApp ou SMS }
      - { valeur: rien, label: Rien de particulier, les gens viennent }

  - id: rythme
    label: Tes élèves viennent plutôt au trimestre, à la carte, ou séance par séance ?
    aide: >-
      Cette réponse compte beaucoup : un abonné au trimestre a déjà sa place,
      alors qu'un élève à la séance la prend au moment où il réserve. Ce n'est
      pas la même chose à construire.
    type: choix
    decisif: true
    requis: true
    autre: true
    options:
      - { valeur: trimestre, label: Plutôt au trimestre }
      - { valeur: carte, label: Plutôt à la carte, avec une carte de séances }
      - { valeur: seance, label: Plutôt séance par séance }
      - { valeur: melange, label: Un peu des trois, selon les élèves }

  - id: mode
    label: >-
      Tu préfères que les gens réservent eux-mêmes et que le site tienne les
      comptes, ou que tu gardes la main et que le site affiche seulement
      « complet » ?
    aide: >-
      C'est **la** question qui décide du prix. Garder la main tient en une
      demi-journée de travail. Faire réserver les gens est un projet à part
      entière.
    type: choix
    decisif: true
    requis: true
    options:
      - valeur: reservent
        label: Les gens réservent eux-mêmes, le site tient les comptes
        aide: Colonnes 2 et 3 du tableau ci-dessus.
      - valeur: garde-main
        label: Je garde la main, le site affiche seulement « complet »
        aide: Colonne 1 du tableau ci-dessus.
      - valeur: indecis
        label: Je ne sais pas encore, j'aimerais qu'on en parle

  - id: annulation
    label: Si quelqu'un annule, la place va à la première personne en attente automatiquement, ou tu choisis ?
    type: choix
    options:
      - { valeur: auto, label: Automatiquement, au premier de la liste }
      - { valeur: moi, label: Je choisis qui prend la place }
      - { valeur: depend, label: Ça dépend des cours }

  - id: aisance
    label: Tes élèves sont-ils à l'aise avec un site web, notamment en gym sénior ?
    aide: >-
      Sans détour : si une partie de tes élèves ne réservera jamais en ligne,
      un outil de réservation te fera gérer deux systèmes au lieu d'un.
    type: choix
    options:
      - { valeur: alaise, label: Oui, dans l'ensemble ils se débrouillent }
      - { valeur: mixte, label: Une partie oui, une partie non }
      - { valeur: telephone, label: Non, c'est plutôt téléphone et WhatsApp }

  - id: budget
    label: Quel ordre de grandeur peux-tu consacrer à ce projet ?
    aide: >-
      Réponds franchement, y compris « je ne sais pas ». Ça ne sert pas à
      ajuster mon prix vers le haut, ça sert à ne pas te proposer quelque chose
      que tu ne prendras pas.
    type: choix
    decisif: true
    requis: true
    options:
      - { valeur: sous-500, label: Moins de 500 € }
      - { valeur: 500-1000, label: De 500 à 1 000 € }
      - { valeur: 1000-3000, label: De 1 000 à 3 000 € }
      - { valeur: plus-3000, label: Plus de 3 000 € }
      - { valeur: inconnu, label: Je ne sais pas encore }

notes:
  - tone: info
    texte: >-
      Ce document ne t'engage à rien et ne déclenche aucune facturation. Il
      sert à te donner un prix juste, et à te dire honnêtement si le jeu en
      vaut la chandelle.
  - texte: >-
      Tes réponses arrivent directement dans ma boîte mail, et tu en reçois une
      copie par mail dans la foulée.
