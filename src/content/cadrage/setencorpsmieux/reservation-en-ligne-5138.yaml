# Premier document de cadrage du format (COO-188, COO-191).
#
# Origine : WhatsApp de Nathalie le 2026-09-05, tracé en SET-16. Demande hors
# périmètre de la refonte, donc facturable, mais trop floue pour être chiffrée :
# « réserver avec un nombre maximal » et « une alerte de liste d'attente »
# recouvrent trois solutions dont les coûts vont de un à dix.
#
# D'où ce document plutôt qu'un rendez-vous : Nathalie n'a jamais dit de budget
# sur ce sujet, et un appel d'une heure pour découvrir qu'il n'y en a pas est
# une heure perdue pour tout le monde.
#
# Version raccourcie le 2026-09-08 : la première rédaction était trop longue
# pour la cliente. Une seule section d'intro, tableau en fragments, cinq
# questions dont les trois décisives. Ce qui a sauté (gêne principale, cours
# concernés, suivi actuel, règle d'annulation) se demande de vive voix au
# moment du chiffrage, une fois qu'on sait qu'il y a un budget.
#
# Tutoiement, comme sur sa proposition commerciale (site-internet-7402.yaml).
# Le formulaire, lui, est vouvoyé : c'est un composant partagé par tous les
# clients. Elle a déjà vu ce mélange sur son devis.
titre: La réservation en ligne de tes cours
objet: Cinq questions avant de te dire ce que ça coûte
date: 2026-09-05
contact: Nathalie
linear:
  projet: Refonte site Internet
  demande: SET-16

intro:
  - titre: Pourquoi ce document
    texte: >-
      Tu veux limiter le nombre de places et prévenir une liste d'attente.
      C'est possible, de trois façons, qui ne coûtent pas du tout la même
      chose. Tu réponds, je chiffre.
    liste:
      - texte: "**Ça ne t'engage à rien.** Rien n'est facturé, rien n'est lancé."
      - texte: "**Cinq minutes.** Cinq questions."
      - texte: >-
          **Si la solution la moins chère suffit,** c'est celle que je te
          proposerai.
    note: >-
      Si tu préfères qu'on en parle de vive voix, dis-le moi et on cale un
      créneau.

comparatif:
  titre: Les trois voies
  texte: Lis les lignes de coût avant de répondre aux questions.
  solutions:
    - nom: Tu gardes la main
      resume: Le site affiche « complet », tu tiens tes inscriptions.
    - nom: Un service de réservation
      resume: Un outil extérieur branché à ton site, qui compte les places.
      recommandee: true
    - nom: Sur mesure dans ton site
      resume: Tout chez toi, jauge et liste d'attente comprises.
  criteres:
    - label: Pour toi
      valeurs:
        - Tu coches les cours complets. Deux minutes.
        - L'outil compte, et te prévient quand c'est plein.
        - Un écran de gestion fait pour ta façon de travailler.
    - label: Pour tes élèves
      valeurs:
        - Ils voient « complet », ils s'inscrivent auprès de toi.
        - Ils réservent depuis leur téléphone, avec confirmation par mail.
        - Ils réservent sans quitter ton site.
    - label: Liste d'attente
      valeurs:
        - Aucune. Tu notes les noms.
        - "Automatique : la place libérée part au premier."
        - Automatique, réglée comme tu veux.
    - label: À installer
      tooltip: >-
        C'est mon temps de travail, facturé une seule fois. Les fourchettes
        sont larges tant que je ne connais pas le détail de ton besoin.
      valeurs:
        - 300 à 500 €
        - 500 à 900 €
        - 3 000 à 5 000 €
    - label: Tous les mois
      valeurs:
        - Rien.
        - Environ 30 €, gratuit pour commencer.
        - Rien, hors entretien annuel.
    - label: Le risque
      valeurs:
        - Un oubli de coche, et le site annonce une place qui n'existe plus.
        - Les élèves les moins à l'aise avec le web renoncent.
        - Un second projet, de la taille de ton site.
  mentionCout: >-
    Ordres de grandeur, donnés avant de connaître tes réponses. Le prix ferme
    vient après, dans une proposition en bonne et due forme.

questions:
  - id: mode
    label: >-
      Tu préfères que les gens réservent eux-mêmes, ou garder la main et que le
      site affiche seulement « complet » ?
    aide: >-
      C'est **la** question qui décide du prix. Garder la main tient en une
      demi-journée. Faire réserver les gens est un projet à part entière.
    type: choix
    decisif: true
    requis: true
    options:
      - valeur: reservent
        label: Les gens réservent eux-mêmes, le site tient les comptes
        aide: Colonnes 2 et 3 du tableau.
      - valeur: garde-main
        label: Je garde la main, le site affiche seulement « complet »
        aide: Colonne 1 du tableau.
      - valeur: indecis
        label: Je ne sais pas encore, j'aimerais qu'on en parle

  - id: rythme
    label: Tes élèves viennent au trimestre, à la carte, ou séance par séance ?
    aide: >-
      Un abonné au trimestre a déjà sa place. Un élève à la séance la prend au
      moment où il réserve. Ce n'est pas la même chose à construire.
    type: choix
    decisif: true
    requis: true
    autre: true
    options:
      - { valeur: trimestre, label: Plutôt au trimestre }
      - { valeur: carte, label: Plutôt à la carte }
      - { valeur: seance, label: Plutôt séance par séance }
      - { valeur: melange, label: Un peu des trois }

  - id: budget
    label: Quel ordre de grandeur peux-tu y consacrer ?
    aide: >-
      Réponds franchement, y compris « je ne sais pas ». Ça sert à ne pas te
      proposer quelque chose que tu ne prendras pas.
    type: choix
    decisif: true
    requis: true
    options:
      - { valeur: sous-500, label: Moins de 500 € }
      - { valeur: 500-1000, label: De 500 à 1 000 € }
      - { valeur: 1000-3000, label: De 1 000 à 3 000 € }
      - { valeur: plus-3000, label: Plus de 3 000 € }
      - { valeur: inconnu, label: Je ne sais pas encore }

  - id: places
    label: Quels cours, et combien de places au maximum ?
    aide: Une réponse approximative suffit. Dis-moi si la jauge change d'un cours à l'autre.
    type: texte
    long: true
    requis: true
    placeholder: Les cours concernés, et le nombre de places

  - id: aisance
    label: Tes élèves sont-ils à l'aise avec un site web ?
    aide: >-
      Sans détour : si une partie d'entre eux ne réservera jamais en ligne, un
      outil de réservation te fera gérer deux systèmes au lieu d'un.
    type: choix
    options:
      - { valeur: alaise, label: Oui, dans l'ensemble }
      - { valeur: mixte, label: Une partie oui, une partie non }
      - { valeur: telephone, label: Non, c'est plutôt téléphone et WhatsApp }

notes:
  - tone: info
    texte: >-
      Tes réponses arrivent dans ma boîte mail, et tu en reçois une copie.
      Rien n'est facturé.
