# Livrable de clôture de la boutique Fylgo (FYL-7). Même référence 3907 que la
# proposition du 24 mars : le client retrouve le même numéro d'un document à
# l'autre.
#
# Ce livrable n'est pas une validation de maquette comme celui de CAFA : la
# boutique est en production et transférée depuis mai. C'est une passation.
#
# Réécrit le 2026-09-21 après dépouillement de l'export WhatsApp
# (docs/WhatsApp Chat - Fylgø Web/_chat.txt). Il corrige une erreur de la
# première version, qui présentait la ligne « Connectivité marketplaces »
# comme non livrée et listait treize questions sans réponse. WhatsApp montre
# que les accès Ankorstore et Faire ont été donnés les 12/05 et 18/07, que
# Paul a répondu sur les coefficients de marge le 29/07 à 17h12, qu'Amazon a
# été écarté par le client le 18/07, et que le setup a été déclaré finalisé le
# 29/07 à 18h11. Il reste quatre questions ouvertes, toutes vérifiées.
#
# À COMPLÉTER AVANT ENVOI (facultatif) : déposer les deux captures sous
# public/livrable/fylgo/ puis décommenter le bloc `apercu`. La page s'affiche
# correctement sans.
#
# L'audit performance et SEO (FYL-5) est fait et intégré, section « L'état de
# santé » : Lighthouse 13.5 en local sur trois pages, en mobile et en bureau,
# plus les contrôles on-page. Ahrefs était inaccessible (forfait insuffisant),
# et les données terrain CrUX n'existent pas, faute de trafic.
#
# Première rédaction de cette section corrigée le même jour : elle attribuait
# la lenteur mobile au format PNG des photos. C'est faux, Shopify convertit
# déjà en WebP selon l'en-tête Accept du navigateur (720 Ko en PNG deviennent
# 260 Ko en WebP sur la même URL). La vraie cause est la règle CSS des sections
# parallax, qui demande width=2000 y compris dans sa variante mobile.
titre: La boutique, et les clés qui vont avec
objet: Le détail de ce qui a été fait, ce qui reste ouvert et pourquoi, et ce que vous pouvez faire sans moi.
date: 2026-09-21
contact: Fabien
linear:
  projet: Boutique Shopify
  affaire: https://linear.app/coolbeans-hq/issue/CRM-28
# Le document part à Fabien, Paul et Laetitia, tous sous fylgodrinks.com.
envoi:
  date: 2026-09-21
  destinataire: fabien.vp@fylgodrinks.com

site:
  url: https://fylgodrinks.com
  label: Ouvrir la boutique

# Captures prises le 2026-09-21 sur fylgodrinks.com, bannière de consentement
# neutralisée par un cookie de consentement posé avant navigation. 1440 × 900
# en x2 et 402 × 874 en x3 (iPhone 15 Pro). Converties en WebP qualité 82 :
# 172 Ko et 121 Ko, contre 2,3 Mo et 1,3 Mo en PNG.
apercu:
  bureau: /livrable/fylgo/accueil-macbook.webp
  mobile: /livrable/fylgo/accueil-iphone.webp
  titre: Fylgo · Mocktails signature sans alcool
  legende: La page d'accueil, telle qu'elle s'affiche aujourd'hui sur ordinateur et sur téléphone.

sections:
  - titre: En deux minutes
    texte: >-
      Si vous ne lisez qu'un paragraphe, lisez celui-ci. Le reste de la page
      est la pièce justificative, consultable quand vous en aurez besoin.
    liste:
      - texte: "**La boutique est livrée et elle tourne.** Elle encaisse, elle expédie, elle est référencée, et elle vend aussi bien aux particuliers qu'aux revendeurs via Ankorstore et Faire. Quatre correctifs ont été posés aujourd'hui même, détaillés plus bas."
      - texte: "**Ce que j'attends de vous tient en trois gestes** : relire les paramètres de vente, trancher le partage du stock entre vos canaux, et me proposer deux créneaux pour l'heure de formation comprise au devis."
      - texte: "**Les quatre lignes du devis du 24 mars sont livrées.** La facture de solde, 3 528 € TTC, vous a été adressée le 24 août."

  - titre: La boutique aujourd'hui
    texte: >-
      Abonnement Shopify Basic, thème premium Flow, en ligne sur votre domaine
      depuis le mois de mai.
    liste:
      - texte: "**Huit références en vente, par carton de douze**, plus une carte cadeau : les quatre mocktails signature, chacun en canette 25 cl à 42 € et en bouteille 33 cl à 48 €. La livraison est offerte à partir de 150 €."
      - texte: "**Cinq pages de contenu** : Notre histoire, Savoir-faire, Suggestions cocktails, Professionnels et Contact, plus les pages légales et le bandeau de consentement aux cookies."
      - texte: "**Le paiement passe par Payplug**, en paiement intégré : le client saisit sa carte sans quitter la boutique."
      - texte: "**Ankorstore et Faire sont branchées**, catalogue et stocks synchronisés automatiquement depuis Shopify. La gestion commerciale de ces deux boutiques vous appartient désormais."
      - texte: "**La direction artistique est portée par le code**, pas par les réglages de l'admin : les polices Stylebender sont chargées dans la feuille de style du thème."
        tooltip: >-
          Conséquence pratique : modifier les paramètres typographiques dans
          Customize ne change rien à l'affichage des titres. C'est voulu. La
          marche à suivre pour changer une police est détaillée dans votre
          documentation, page « Référence et support ».

  - titre: Ce qui a été fait
    texte: >-
      Le détail du travail mené entre le kick-off du 30 mars et aujourd'hui,
      recoupé avec les quatre lignes du devis du 24 mars. Rien n'a été facturé
      en dehors de ce devis.
    replie: Voir les quinze postes, ligne par ligne
    liste:
      - texte: "**Choix du thème** : installation et test de plusieurs thèmes premium en conditions réelles, avec vos packshots, puis tableau comparatif et recommandation argumentée."
        tooltip: Avril. Ligne « Cadrage et setup technique » du devis.
      - texte: "**Configuration de fond de la boutique** : domaine et DNS chez OVH, taux de taxe, zones et modes de livraison, adresse d'expédition, paiement express, emails de commande. Ces réglages ont été posés puis soumis à votre validation, qui reste attendue."
      - texte: "**Mise en place du paiement** : Payplug installé par interface de programmation et activé en paiement intégré."
      - texte: "**Catalogue** : huit références distinctes, chacune avec sa description, son code article, ses metafields et ses visuels."
      - texte: "**Intégration de la direction artistique** : couleurs, styles de boutons, et les deux polices Stylebender, Retro et Italic Ornate, chargées dans la feuille de style du thème et appliquées aux titres."
      - texte: "**Page d'accueil, page Notre histoire, page Contact et gabarit produit** : assemblage des sections, hiérarchie visuelle, metafield « plantes utilisées » en sous-titre de chaque fiche, et produits complémentaires activés."
        tooltip: Ligne « Intégration design » du devis.
      - texte: "**Pages légales, mentions légales retravaillées puis ajoutées au pied de page, et bandeau de consentement aux cookies.**"
      - texte: "**Navigation** : menu Mocktails signature et ses deux sous-menus, en-tête, pied de page, panier latéral."
      - texte: "**Traitement technique des visuels** : intégration des packshots haute définition sur fond transparent, pictogrammes « Enrichi en plantes » et « Agriculture Biologique », favicon."
      - texte: "**Référencement** : déclaration dans la Google Search Console, envoi automatique du plan de site, et affichage de la devise selon la convention française."
      - texte: "**Plateformes de revente** : applications Ankorstore et Faire installées, connectées et paramétrées, catalogue et stocks synchronisés. Setup finalisé le 29 juillet."
        tooltip: >-
          Ligne « Connectivité marketplaces » du devis. Amazon a été écarté
          d'un commun accord le 18 juillet, l'expérience précédente de Fylgo
          sur Seller Central ayant conduit à reporter ce canal.
      - texte: "**Email marketing** : Brevo relié à la boutique, et fenêtre d'inscription du thème désactivée selon votre choix."
      - texte: "**Transfert de propriété de la boutique à Fylgo.**"
      - texte: "**Gestion de projet** : point hebdomadaire du lundi animé jusqu'à la mise en ligne, guide de setup rédigé et tenu à jour, recommandations de rédaction pour les pages Notre histoire et Professionnels."
        tooltip: Ligne « Gestion de projet et support » du devis.
      - texte: "**Quatre correctifs posés le 21 septembre** : le libellé du bouton d'ajout au panier, le code promo Fylgo10 qui était annoncé sans exister, le bandeau de consentement aux cookies, et la carte cadeau du menu qui menait à une page introuvable."

  - titre: L'état de santé
    texte: >-
      Promis fin août, le voici. J'ai mesuré la boutique avec Lighthouse,
      l'outil de Google, sur trois pages, en version ordinateur et en version
      téléphone, puis j'ai passé en revue ce que les moteurs de recherche y
      lisent.
    liste:
      - texte: "**Sur ordinateur, la boutique est rapide.** 84 sur 100 pour l'accueil, 86 pour une collection, 96 pour une fiche produit. L'accueil affiche son image principale en 2,4 secondes, juste sous le seuil de 2,5 secondes que Google considère comme bon."
      - texte: "**Sur téléphone, elle ne l'est pas.** 64, 68 et 62. L'accueil met 11 secondes à afficher son image principale, la fiche produit 9. C'est le point qui compte le plus, parce que Google classe les sites d'après leur version mobile et non leur version ordinateur."
      - texte: "**La cause est identifiée et elle est à ma main.** Trois images de fond sont servies aux téléphones à la taille prévue pour les grands écrans, 2000 pixels de large, soit 799 Ko à elles seules. Demandées à une taille adaptée, elles en pèseraient 474. C'est un réglage du thème, il ne demande rien de votre côté."
        tooltip: >-
          Le détail, sur la première des trois. Servie en 2000 pixels de large,
          elle pèse 346 Ko. En 1200 pixels, 256 Ko. En 900 pixels, 168 Ko. En
          600 pixels, 90 Ko. C'est la même image, et sur un téléphone de 402
          pixels de large la différence ne se voit pas. Le format n'est pas en
          cause : Shopify convertit déjà tout seul vos images au format le plus
          léger que le navigateur sait lire.
      - texte: "**Le reste de la structure est sain.** Aucun décalage de mise en page pendant le chargement, rien qui bloque l'interaction, et 100 sur 100 au référencement technique de l'accueil. Le site n'est pas mal construit, il est trop lourd à un endroit précis."
      - texte: "**Neuf pages n'ont pas de description pour les moteurs de recherche** : vos quatre collections et vos cinq pages de contenu. C'est le texte gris affiché sous le titre dans les résultats de Google. Quand il manque, Google va chercher une phrase au hasard dans la page. Les fiches produit et l'accueil, eux, en ont une."
    note: >-
      Vous pouvez tout revérifier vous-même :
      [mesurer la boutique avec l'outil de Google](https://pagespeed.web.dev/analysis?url=https%3A%2F%2Ffylgodrinks.com%2F).
      Ces chiffres sont mesurés en laboratoire, sur une connexion simulée.

  - titre: Ce qu'il reste, et chez qui
    texte: >-
      Quatre questions vous ont été posées par mail, plusieurs à trois reprises,
      et sont toujours ouvertes. Aucune ne bloque la boutique telle qu'elle
      tourne aujourd'hui. Toutes bloquent ce qui viendrait après.
    liste:
      - texte: "**La repasse sur les paramètres de vente, page par page dans l'admin Shopify.** Demandée le 16 juillet, redemandée le 29 juillet : taux de TVA, frais de port et seuil de livraison offerte, adresse d'expédition, moyens de paiement, emails de commande, adresse de contact retenue."
      - texte: "**La relecture de vos deux fiches Ankorstore et Faire**, demandée le 29 juillet à la livraison du paramétrage. Quatre choses à valider : les prix de gros, le minimum de commande, le seuil de port offert, et le texte de présentation de la marque que voient les revendeurs."
        tooltip: >-
          Les prix de gros découlent des coefficients que vous m'avez donnés
          le 29 juillet, 2,2 sur les canettes et 2,5 sur les bouteilles. Le
          minimum de commande et le seuil de port offert sont, eux, les
          valeurs que je vous avais proposées par défaut le même jour, 150 €
          et 250 € hors taxes, faute de réponse de votre côté. Tout cela se
          modifie directement dans les interfaces d'Ankorstore et de Faire,
          pas dans Shopify.
      - texte: "**Le mode de gestion du stock entre vos canaux**, commun ou réservé. Posée le 16 juillet. C'est le seul point réellement technique de ce document, et il est détaillé juste en dessous."
      - texte: "**L'identifiant de mesure GA4 et un accès administrateur**, si et seulement si vous voulez une mesure plus fine que celle de Shopify. Demandés le 18 mai, redemandés le 3 juin. À ce stade, rien n'a besoin d'être branché."
        tooltip: >-
          Le jour où vous le voudrez : créez une propriété GA4 sur
          analytics.google.com, ouvrez Administration puis Flux de données,
          créez un flux Web pointant sur fylgodrinks.com, et transmettez-moi
          l'identifiant de mesure, qui commence par G-. Ajoutez-moi ensuite
          comme administrateur de la propriété. Je m'occupe du reste.
      - texte: "**Une heure de formation en visio et cinq heures de support technique** sont comprises dans le devis et n'ont pas encore été utilisées. Répondez-moi avec deux créneaux et je vous envoie l'invitation."
    note: >-
      La collecte d'adresses email, elle, est plafonnée : une adresse n'entre
      dans votre liste qu'au moment d'une commande ou de la création d'un
      compte, parce que la fenêtre d'inscription du thème est désactivée. C'est
      le principal levier de croissance de votre liste, et il est à l'arrêt.

  - titre: Le stock entre vos canaux
    texte: >-
      Le seul point de ce document qui puisse vous coûter de l'argent si
      personne ne le tranche. Shopify tient **un seul compteur de stock par
      référence**, et vos trois vitrines y puisent : la boutique, Ankorstore et
      Faire. Il n'y a pas un stock « site » et un stock « revendeurs », il y a
      votre stock, affiché à trois endroits.
    replie: Voir l'exemple chiffré et les deux options
    liste:
      - texte: "**L'exemple.** Vous avez aujourd'hui 13 cartons de HAVANA Mule 25 cl. Un caviste en commande 8 sur Ankorstore. Dans la minute, votre site n'en affiche plus que 5, et Faire non plus. Si un particulier en voulait 6 le même soir, il voit « victime de son succès » alors que la commande du caviste n'est peut-être même pas encore expédiée."
      - texte: "**Option A, le stock commun. C'est ce qui tourne aujourd'hui.** Tout le monde puise au même endroit, premier arrivé premier servi. Zéro entretien, et vous ne vendez jamais un carton que vous n'avez pas. Le revers est celui de l'exemple ci-dessus."
      - texte: "**Option B, le stock réservé par canal.** Vous coupez la poire, par exemple 8 cartons au site et 5 au B2B. Chaque vitrine a sa réserve et personne ne mange celle de l'autre. Le revers : il faut rééquilibrer à la main de temps en temps, et une vitrine peut afficher « épuisé » alors qu'il reste des cartons dans l'autre réserve."
      - texte: "**Ce que je vous recommande.** Rester en option A tant que le volume de gros est faible, et basculer en option B le jour où une commande de revendeur vous fait perdre une vente grand public. La bascule prend quelques minutes et se défait aussi vite."
    note: >-
      Si un point de cette page vous paraît obscur, dites-moi lequel et je le
      réécris ici : c'est plus utile pour vous qu'une explication de vive voix
      qu'il faudrait redemander dans six mois.

