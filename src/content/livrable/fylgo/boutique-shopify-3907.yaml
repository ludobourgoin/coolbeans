sections:
  - titre: Ce qui est en ligne
    texte: >-
      La boutique tourne sur votre domaine depuis mai, sur un abonnement
      Shopify Basic et le thème premium Flow. Elle encaisse, elle expédie,
      elle est référencée.
    liste:
      - texte: "**Huit références en vente, par carton de douze** : les quatre mocktails signature, chacun en canette 25 cl à 42 € et en bouteille 33 cl à 48 €."
      - texte: "**Trois collections alimentées** : la gamme complète, le format 25 cl et le format 33 cl. La livraison est offerte à partir de 150 €, par une remise automatique."
      - texte: "**Cinq pages de contenu** : Notre histoire, Savoir-faire, Suggestions cocktails, Professionnels et Contact, plus les pages légales."
      - texte: "**Le paiement passe par Payplug**, en paiement intégré : le client saisit sa carte sans quitter la boutique."
      - texte: "**Le site est déclaré dans la Google Search Console** et lui envoie son plan de site automatiquement, à chaque ajout de produit ou de page."
      - texte: "**Ankorstore et Faire sont branchées.** Le catalogue et les stocks remontent automatiquement depuis Shopify. La gestion commerciale de ces deux boutiques vous appartient désormais."
      - texte: "**La direction artistique est portée par le code**, pas par les réglages de l'admin : les polices Stylebender sont chargées dans la feuille de style du thème."
        tooltip: >-
          Conséquence pratique : modifier les paramètres typographiques dans
          Customize ne change rien à l'affichage des titres. C'est voulu. La
          marche à suivre pour changer une police est détaillée dans votre
          documentation, page « Référence et support ».

  - titre: Tout ce qui a été fait
    texte: >-
      Le détail du travail, dans l'ordre où il a été mené, entre le kick-off
      du 30 mars et aujourd'hui. Il recoupe les quatre lignes du devis du
      24 mars.
    liste:
      - texte: "**Choix du thème** : installation et test de plusieurs thèmes premium en conditions réelles, avec vos packshots, puis tableau comparatif et recommandation argumentée."
        tooltip: Avril. Ligne « Cadrage et setup technique » du devis.
      - texte: "**Configuration de fond de la boutique** : domaine et DNS chez OVH, taux de taxe, zones et modes de livraison, adresse d'expédition, paiement express, emails de commande. Ces réglages ont été posés puis soumis à votre validation, qui reste attendue (voir plus bas)."
      - texte: "**Mise en place du paiement** : Payplug installé par interface de programmation et activé en paiement intégré, pour que le client ne quitte jamais la boutique."
      - texte: "**Catalogue** : huit références distinctes, chacune avec sa description, son code article, ses metafields et ses visuels."
      - texte: "**Intégration de la direction artistique** : couleurs, styles de boutons, et les deux polices Stylebender, Retro et Italic Ornate, chargées dans la feuille de style du thème et appliquées aux titres."
        tooltip: >-
          Ce point ne se règle pas depuis l'admin. C'est une surcharge écrite
          dans le code du thème, la seule façon d'imposer vos polices par
          dessus celles de Flow.
      - texte: "**Page d'accueil, page Notre histoire, page Contact et gabarit produit** : assemblage des sections, hiérarchie visuelle, metafield « plantes utilisées » en sous-titre de chaque fiche, et produits complémentaires activés."
        tooltip: Ligne « Intégration design » du devis.
      - texte: "**Pages légales, et mentions légales retravaillées puis ajoutées au pied de page.**"
      - texte: "**Navigation** : menu Mocktails signature et ses deux sous-menus, en-tête, pied de page, panier latéral."
      - texte: "**Traitement technique des visuels** : intégration des packshots haute définition sur fond transparent, pictogrammes « Enrichi en plantes » et « Agriculture Biologique », favicon."
      - texte: "**Référencement** : déclaration dans la Google Search Console, envoi automatique du plan de site, et affichage de la devise selon la convention française."
      - texte: "**Plateformes de revente** : applications Ankorstore et Faire installées, connectées et paramétrées, catalogue et stocks synchronisés depuis Shopify. Setup finalisé le 29 juillet."
        tooltip: >-
          Ligne « Connectivité marketplaces » du devis. Amazon a été écarté
          d'un commun accord le 18 juillet, l'expérience précédente de Fylgo
          sur Seller Central ayant conduit à reporter ce canal.
      - texte: "**Email marketing** : Brevo relié à la boutique, et fenêtre d'inscription du thème désactivée selon votre choix."
      - texte: "**Transfert de propriété de la boutique à Fylgo.**"
      - texte: "**Gestion de projet** : point hebdomadaire du lundi animé jusqu'à la mise en ligne, guide de setup rédigé et tenu à jour, recommandations de rédaction pour les pages Notre histoire et Professionnels."
        tooltip: Ligne « Gestion de projet et support » du devis.
      - texte: "**Documentation de passation**, cinq pages, accessible depuis votre espace client."
    note: >-
      S'y ajoute ce qui n'était pas au devis : la vérification de votre
      boutique et de votre administration pendant la panne Shopify des 3 et
      4 juin, et la correction des défauts relevés depuis la mise en ligne.

  - titre: Les choix qui tiennent la boutique
    texte: >-
      Trois décisions expliquent la boutique telle qu'elle est aujourd'hui.
    liste:
      - texte: "**Un thème premium plutôt qu'un développement sur mesure.** La structure de Flow est éprouvée et tenue à jour par son éditeur. Nous l'avons mise aux couleurs de Fylgo au lieu de repartir d'une page blanche : c'est ce qui a permis de tenir le budget annoncé en mars."
      - texte: "**Huit produits distincts plutôt que quatre produits à variantes**, comme vous l'avez demandé en avril. Chaque format a ainsi son visuel, son prix et sa fiche, et se vend séparément sur les plateformes de revente, où un caviste commande à la référence."
      - texte: "**Aucun outil de mesure en plus de Shopify.** Les statistiques natives couvrent les visites, les sources de trafic, la conversion et le chiffre d'affaires. À ce stade elles suffisent, et il n'y a pas un réglage de plus à maintenir."
        tooltip: >-
          Google Analytics ne devient utile que le jour où vous lancez une
          campagne payante, Google ou Meta, et où il faut attribuer chaque
          euro dépensé. Si vous le souhaitez, je le branche : il me faut
          l'identifiant de mesure GA4 et un accès administrateur, demandés
          le 18 mai puis le 3 juin.

  - titre: Ce qui reste ouvert, et chez qui
    texte: >-
      Trois sujets, dont deux qui vous appartiennent. Je les écris noir sur
      blanc plutôt que de les laisser dans un fil de mails.
    liste:
      - texte: "**La relecture des paramètres de vente, dans Shopify et sur les deux plateformes.** Les réglages sont posés et fonctionnels. Ce qui manque est votre passage page par page pour confirmer qu'ils disent bien ce que vous voulez vendre : taux de taxe, frais de port, seuil de livraison offerte, minimum de commande en gros, conditions affichées aux revendeurs."
      - texte: "**L'ouverture commerciale d'Ankorstore et de Faire.** La plomberie est en place et le catalogue remonte. Les animer, accepter les revendeurs, suivre les commandes, ajuster les conditions : tout cela relève de votre activité commerciale, pas du site."
      - texte: "**La collecte d'adresses email est plafonnée.** Une adresse n'entre aujourd'hui dans la liste qu'au moment d'une commande ou de la création d'un compte, parce que la fenêtre d'inscription du thème est désactivée. C'est le principal levier de croissance de votre liste, et il est à l'arrêt : le jour où vous voulez des abonnés, c'est par là qu'il faut passer. Le réglage est dans votre documentation."

  - titre: Le stock, et pourquoi il faut trancher avant d'ouvrir les vannes
    texte: >-
      C'est le seul point réellement technique de ce document, et le seul qui
      puisse vous coûter de l'argent si personne ne le tranche. Il tient en
      trois paragraphes.
    liste:
      - texte: "**Shopify tient un seul compteur de stock par référence, et tous les canaux y puisent.** Il n'y a pas un stock « site » et un stock « Ankorstore » : il y a votre stock, et trois vitrines qui affichent le même nombre."
      - texte: "**L'exemple.** Vous avez aujourd'hui 13 cartons de HAVANA Mule 25 cl. Un caviste en commande 8 sur Ankorstore. Dans la minute, votre site n'en affiche plus que 5, et Faire non plus. Si un particulier en voulait 6 le même soir, il voit « victime de son succès » alors que la commande du caviste n'est peut-être même pas encore expédiée."
      - texte: "**Option A, le stock commun. C'est ce qui tourne aujourd'hui.** Tout le monde puise au même endroit, premier arrivé premier servi. Zéro entretien, zéro réglage, et vous ne vendez jamais un carton que vous n'avez pas. Le revers est celui de l'exemple ci-dessus : une grosse commande de gros peut vider la vitrine grand public du jour au lendemain."
        tooltip: >-
          À retenir : le stock commun ne fait courir aucun risque de survente.
          Il fait courir un risque de rupture visible côté site, au profit du
          B2B, qui commande par gros volumes.
      - texte: "**Option B, le stock réservé par canal.** Vous coupez la poire : par exemple 8 cartons au site et 5 au B2B. Chaque vitrine a sa réserve, et personne ne mange celle de l'autre. Votre site ne tombe plus en rupture à cause d'un caviste. Le revers : il faut rééquilibrer à la main de temps en temps, et une vitrine peut afficher « épuisé » alors qu'il reste des cartons dans l'autre réserve."
      - texte: "**Ce que je vous recommande.** Rester en option A tant que le volume de gros est faible, et basculer en option B le jour où une commande de revendeur vous fait perdre une vente grand public. La bascule se fait en quelques minutes et se défait aussi vite : ce n'est pas une décision irréversible, c'est une décision à prendre en connaissance de cause."
    note: >-
      Si un point de cette page vous paraît obscur, dites-moi lequel et je le
      réécris ici : c'est plus utile pour vous qu'une explication de vive voix
      qu'il faudrait redemander dans six mois.

  - titre: Les questions restées sans réponse
    texte: >-
      Ces questions vous ont été posées par mail, plusieurs à trois reprises.
      Elles sont toutes encore ouvertes aujourd'hui. Je les rassemble ici :)
    liste:
      - texte: "**La repasse sur les paramètres de la boutique, page par page dans l'admin Shopify.** Demandée le 16 juillet, redemandée le 29 juillet : taux de TVA, frais de port et seuil de livraison offerte, adresse d'expédition, moyens de paiement activés, emails de commande, adresse de contact retenue."
      - texte: "**La relecture des paramètres d'Ankorstore et de Faire**, dans le même esprit. Demandée le 29 juillet, à la livraison du setup."
      - texte: "**Le mode de gestion du stock entre les canaux**, commun ou réservé. Posée le 16 juillet. La section précédente la reprend en détail, avec l'exemple chiffré."
      - texte: "**L'identifiant de mesure GA4 et un accès administrateur**, si et seulement si vous voulez une mesure plus fine que celle de Shopify. Demandés le 18 mai, redemandés le 3 juin. Sans eux rien ne se branche, et à ce stade rien n'a besoin de l'être."
        tooltip: >-
          Le jour où vous le voudrez : créez une propriété GA4 sur
          analytics.google.com, ouvrez Administration puis Flux de données,
          créez un flux Web pointant sur fylgodrinks.com, et transmettez-moi
          l'identifiant de mesure, qui commence par G-. Ajoutez-moi ensuite
          comme administrateur de la propriété. Je m'occupe du reste.
    note: >-
      Aucune de ces questions ne bloque la boutique telle qu'elle tourne
      aujourd'hui. Toutes bloquent ce qui viendrait après.

  - titre: Ce qui vous appartient
    texte: >-
      La boutique vous a été transférée en mai. Ce document en est la
      contrepartie écrite : tout ce qui la fait tourner est à vous, et rien
      ne dépend d'un abonnement chez moi.
    liste:
      - texte: "**La boutique et ses comptes.** Vous en êtes propriétaires et administrateurs. Payplug, Brevo, la Search Console, Ankorstore, Faire et le nom de domaine chez OVH sont vos comptes, à vos noms."
      - texte: "**Le code du thème est sauvegardé dans un dépôt privé à votre nom**, polices et surcharges comprises. Un thème de secours non publié dort par ailleurs sur la boutique."
      - texte: "**Une documentation de cinq pages**, tenue à jour, accessible depuis votre espace client : ce que contient la boutique, ce que vous pouvez modifier vous-même, ce qu'il ne faut jamais toucher, qui a accès à quoi, et comment demander une intervention."
      - texte: "**Une heure de formation en visio et cinq heures de support technique** sont comprises dans le devis et n'ont pas encore été utilisées. Prenons la formation maintenant : répondez-moi avec deux créneaux qui vous arrangent et je vous envoie l'invitation."

