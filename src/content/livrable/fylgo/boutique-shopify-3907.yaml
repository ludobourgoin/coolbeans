aVerifierTitre: Ce que je vous demande de vérifier
aVerifier:
  - "**Les paramètres de vente, page par page dans l'admin Shopify.** Taux de TVA appliqués, frais de port et seuil de livraison offerte, adresse d'expédition, moyens de paiement activés, emails de confirmation de commande. Une erreur à cet endroit ne se voit qu'à la première commande réelle, et le petit nombre de commandes encaissées à ce jour n'a pas encore fait office de test grandeur nature."
  - "**L'adresse de contact de la boutique**, aujourd'hui `paul.levy@fylgodrinks.com`. C'est elle qui reçoit les formulaires et qui apparaît dans les emails envoyés aux clients. Est-ce celle que vous gardez ?"
  - "**Les mentions légales** : la raison sociale ABEAM DRINKS, le SIRET, l'adresse de Neuilly, et le nom du responsable de la publication."
  - "**Les textes des pages Notre histoire, Savoir-faire et Suggestions cocktails**, montés à partir de vos documents. Ils se corrigent sans passer par moi, mais depuis Customize et non depuis l'éditeur de Pages, où la zone de texte est vide : tout le contenu de ces trois pages vit dans les sections du thème. La marche à suivre est dans votre documentation."
  - "**Les prix affichés**, toutes taxes comprises, sur les huit références et les deux packs."

suiteTitre: La suite
suite:
  - texte: "Confirmer les paramètres de vente, ou me dire ce qui cloche."
    owner: client
  - texte: "Trancher les trois décisions commerciales pour Faire et Ankorstore : prix de gros par référence, minimum de commande, seuil de port offert."
    owner: client
  - texte: "M'ajouter comme utilisateur sur Seller Central, et me transmettre les ASIN ou les EAN des huit références."
    owner: client
  - texte: "Choisir le mode de gestion du stock entre les canaux : commun, ou réservé par canal."
    owner: client
  - texte: "Brancher Faire et Ankorstore, puis Amazon. Environ une journée à réception des décisions et des accès."
    owner: coolbeans
  - texte: "Poser l'heure de formation et ouvrir les cinq heures de support, quand vous voulez."
    owner: coolbeans

notes:
  - tone: info
    texte: >-
      Ce document se met à jour. Après vos retours, la nouvelle version
      apparaît ici, au même lien, et la précédente reste consultable.
  - tone: neutral
    texte: >-
      La facture de solde de 3 528 € TTC a été émise le 24 août. Elle couvre
      l'intégralité du devis du 24 mars, branchement des plateformes de
      revente compris : celui-ci reste dû de ma part et s'exécute dès que les
      décisions ci-dessus sont prises.
