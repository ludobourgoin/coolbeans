aVerifierTitre: Ce que je vous demande de relire
aVerifier:
  - "**Les mentions légales** : la raison sociale ABEAM DRINKS, le SIRET, l'adresse de Neuilly, et le nom du responsable de la publication."
  - "**L'adresse de contact de la boutique**, aujourd'hui `paul.levy@fylgodrinks.com`. C'est elle qui reçoit les formulaires et qui apparaît dans les emails envoyés à vos clients."
  - "**Les textes des pages Notre histoire, Savoir-faire et Suggestions cocktails.** Ils se corrigent sans passer par moi, mais depuis Customize et non depuis l'éditeur de Pages, où la zone de texte est vide. La marche à suivre est dans votre documentation."
  - "**Les prix affichés**, toutes taxes comprises, sur les huit références."

