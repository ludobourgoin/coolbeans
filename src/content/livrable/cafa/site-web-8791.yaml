aVerifierTitre: Ce que je vous demande de vérifier
aVerifier:
  - "La direction visuelle dans son ensemble : est-ce que c'est le Club ?"
  - "Le texte de la page Qui sommes-nous : c'est celui de la brochure, avec quelques phrases en gras que j'ai choisies."
  - "L'accroche de l'accueil et la page Devenir membre, que j'ai écrites."
  - "Les titres des anciens articles, repris tels quels de l'ancien blog."
  - "Les mentions légales : le nom de la présidente comme directrice de la publication, et l'adresse du Club."
  - "La version allemande, en particulier les actualités et l'événement."
  - "**La photo de Toulouse sur l'accueil.** J'en ai réuni treize, [à comparer ici](https://claude.ai/artifact/WKMeU4zhsVQJfYyzZHX6bJ). Celle en place est la n° 1. Laquelle gardez-vous ?"
  - "**Le bureau, sur la page Qui sommes-nous.** Il présente Susanne Salerno et Karsten Fröhlke. Voulez-vous y ajouter d'autres membres ? Et un lien vers le profil LinkedIn de chacun ?"
  - "**Les photos de la page Qui sommes-nous sont un exemple**, pas un choix définitif : trois images reprises de votre page LinkedIn pour montrer l'effet. Envoyez-moi celles que vous voulez y voir, elles se remplacent en un clic."

suiteTitre: La suite
suite:
  - texte: Choisir le nom de domaine, dans le document de cadrage.
    owner: client
  - texte: Créer le compte Resend, qui fera partir les formulaires, et m'y ajouter.
    owner: client
  - texte: "M'envoyer une photo de Karsten Fröhlke en bonne définition, les logos de vos partenaires, et les photos d'événements que vous voulez voir sur le site."
    owner: client
  - texte: Brancher les formulaires et la mesure de fréquentation, puis mettre le site en ligne sur votre domaine.
    owner: coolbeans
  - texte: Vous former à la mise à jour du site, et vous remettre la documentation.
    owner: coolbeans

notes:
  - tone: info
    texte: >-
      Ce document se met à jour. Après vos retours, la nouvelle version
      apparaît ici, au même lien, et la précédente reste consultable.
