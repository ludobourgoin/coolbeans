  legende: La page d'accueil après vos retours, sur ordinateur et sur téléphone.

sections:
  - titre: L'écriture, comme Anja l'a proposée
    texte: >-
      Sa planche est adoptée telle quelle. Deux caractères, et une hiérarchie
      qui se fait à la graisse plutôt qu'au mélange de familles.
    liste:
      - texte: "**Clash Grotesk** porte les titres et le texte. C'est le caractère de votre planche."
      - texte: "**Tabular**, la machine à écrire, porte le nom allemand sous le nom français, les petites étiquettes comme « Prochain rendez-vous », et les liens de service."
      - texte: "**L'italique disparaît.** Clash Grotesk n'en a pas, et Anja ne l'utilisait pas : le nom dans l'autre langue passe en Tabular, exactement comme sur sa planche."
      - texte: "Les deux caractères sont hébergés sur le site, et non appelés chez un tiers. Un site consulté depuis l'Allemagne n'envoie l'adresse de ses visiteurs à personne."

  - titre: Les photos
    liste:
      - texte: "**L'accueil prend la photo n° 2**, le Pont Neuf au crépuscule, celle que vous avez choisie toutes les deux. Son auteur est crédité sous l'image, sa licence l'exige."
      - texte: "**Votre portrait** vient de la rencontre à TSE, comme vous le demandiez. Recadré pour tenir la même échelle que celui de Karsten."
      - texte: "**La photo de la mairie reste**, mais sa légende ne dit plus que c'est vous. Elle disait « Susanne Salerno, présidente, à la Mairie de Toulouse ». Elle dit maintenant « Rencontre à la Mairie de Toulouse »."
      - texte: "**La vue de TSE ouvre la galerie** de Qui sommes-nous, votre nom et votre fonction lisibles à l'écran derrière vous."
      - texte: "**Le kakemono d'Anja** est ailleurs, comme elle le demandait : sur Devenir membre, en grand, entre le texte et la demande d'adhésion. Il est crédité à son nom."
      - texte: "**L'affiche du 3 juin** illustre enfin l'actualité qui lui correspond, et **la bannière du congrès** celle de Montpellier."

  - titre: Les dates des anciens articles
    texte: >-
      Vous aviez raison, et le problème allait plus loin que vous ne le pensiez.
    liste:
      - texte: "Vous aviez repéré huit articles au 27 juillet 2026. En vérifiant, **32 des 38 articles** portaient la date à laquelle vous les aviez saisis, et non celle de l'événement."
      - texte: "Les vraies dates étaient dans vos titres, et parfois dans le texte. Les 32 sont corrigées."
      - texte: "**Trois articles résistent**, faute d'une date écrite où que ce soit. Je vous les liste plus bas."

  - titre: Le reste
    liste:
      - texte: "**La Région Occitanie** rejoint les soutiens institutionnels, avec son logo officiel en rouge."
      - texte: "**Le lien LinkedIn** est en place sous votre fonction et sous celle de Karsten. Un lien sobre, rien de plus. Dites-moi si Karsten préfère que le sien n'y figure pas."
      - texte: "**Le nom de domaine** est retenu : cafa-toulouse. Le document pour l'acheter vous-même vous arrive séparément."

