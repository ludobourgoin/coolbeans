# Ronde de relecture 1 du site CAFA-TO, composée le 2026-09-22 après les
# retours de Susanne et d'Anja du 18/09. Se déclare par `versionDe` et partage
# l'URL de la V1, pour que la cliente n'ait qu'un lien à garder. On ne lui
# demande pas de comparer : elle relit la version d'aujourd'hui.
titre: Vos retours sont intégrés
objet: Ce que vous avez demandé le 18 septembre, et ce que j'en ai fait.
date: 2026-09-22
contact: Susanne
version: 2
versionDe: cafa/site-web-8791
linear:
  projet: Site web CAFA
  affaire: CRM-9

site:
  url: https://revision-1-cafa.ludo-c97.workers.dev
  label: Ouvrir la nouvelle version

apercu:
  bureau: /livrable/cafa/accueil-v2-macbook.png
  mobile: /livrable/cafa/accueil-v2-iphone.png
