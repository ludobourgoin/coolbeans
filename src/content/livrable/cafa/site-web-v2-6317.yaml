aVerifierTitre: Ce que je vous demande de regarder
aVerifier:
  - "**L'écriture dans son ensemble.** C'est le changement le plus visible, et celui sur lequel un retour en arrière est le plus simple."
  - "**Votre portrait**, qui est un recadrage d'une photo prise de loin. Si le rendu ne vous plaît pas, envoyez-m'en une autre."
  - "**Les dates des actualités**, en parcourant la liste. Certaines viennent de vos titres, d'autres du corps de vos articles."
  - "**Trois articles gardent une date douteuse**, faute de date écrite quelque part : « Le tournant énergétique en Allemagne », « L'Allemagne, la France et l'Europe après les élections », « Conseil d'Administration et Assemblée Générale ». Vous seule pouvez les dater."
  - "**La galerie de Qui sommes-nous.** Elle compte quatre images aujourd'hui. Dites-moi celles que vous gardez, et celles que vous remplacez."
  - "**Le kakemono sur Devenir membre.** Il porte la phrase du Club, « Au cœur du partenariat franco-allemand, pour l'Europe ». Dites-moi si cette place vous convient."

suiteTitre: La suite
suite:
  - texte: Me dire si l'écriture vous convient, ou si nous revenons à la précédente.
    owner: client
  - texte: "Acheter le nom de domaine, avec le document que je vous envoie à part. L'extension, .fr ou .org, vous revient."
    owner: client
  - texte: "Créer le compte Resend, gratuit, qui expédiera vers votre boîte les messages laissés dans vos formulaires, et m'y ajouter."
    owner: client
  - texte: "Me transmettre les retours de Karsten et sa photo en bonne définition."
    owner: client
  - texte: Dater les trois articles qui résistent.
    owner: client
  - texte: Brancher les formulaires et la mesure de fréquentation, puis mettre le site en ligne sur votre domaine.
    owner: coolbeans
  - texte: Vous former à la mise à jour du site, et vous remettre la documentation.
    owner: coolbeans

notes:
  - tone: info
    texte: >-
      Vos formulaires ne partent pas encore. Quand un visiteur laisse un
      message, un service doit l'expédier vers la boîte du Club : c'est Resend.
      Le compte est gratuit à votre volume et s'ouvre en quelques minutes, une
      fois le domaine acheté. Vous le créez au nom du Club, vous m'y ajoutez,
      je fais le reste. D'ici là, un formulaire testé affiche une erreur,
      c'est attendu.
  - tone: info
    texte: >-
      Ce document se met à jour. Chaque relecture s'ajoute ici, au même lien.
      Vous n'avez qu'une adresse à garder.
