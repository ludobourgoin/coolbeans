titre: Osmose x Coolbeans
objet: Identité de marque et site du lieu
date: 2026-09-04
contact: Nathalie
linear:
  projet: Osmose — identité et site
  affaire: CRM-71

sections:
  - titre: Ce que j'ai compris
    texte: >-
      Osmose ouvre ses portes au public. C'est un espace commun, qui accueille
      quatre à cinq praticiens du bien-être à leurs propres horaires et
      l'association À l'Assaut pour les cercles de discussion et les soirées.
    liste:
      - texte: >-
          Aujourd'hui, on ne peut trouver Osmose qu'en passant devant la porte ou
          en connaissant quelqu'un.
      - texte: >-
          Chaque praticien communique déjà de son côté. Le site du lieu ne remplace
          pas leurs pages : il les réunit et renvoie vers elles.
      - texte: >-
          Il n'existe ni logo ni couleurs arrêtées. L'oiseau peint sur le mur est
          le bon point de départ, et tu veux quelque chose de sobre.
    note: >-
      Si l'un de ces trois points est faux, dis-le moi avant de lire le reste :
      toute la proposition est construite dessus.

  - titre: Ce que le site change
    liste:
      - texte: >-
          Une adresse web à partager. « Je consulte au lieu Osmose » devient un lien
          qui montre le cadre, les praticiens et les horaires.
      - texte: >-
          Chaque praticien a sa présentation, avec un lien vers son propre site ou
          sa page Facebook. Le visiteur qui cherche un rendez-vous part directement
          chez lui.
      - texte: >-
          Un atelier annoncé une fois profite à tout le monde : l'agenda est
          commun, et quelqu'un venu pour un shiatsu voit aussi passer une séance
          de ciné-club ou un atelier relaxation.
      - texte: >-
          Tu ajoutes toi-même un praticien, un atelier ou une photo, sans me
          demander et sans attendre.

  - titre: Le site
    liste:
      - texte: "Accueil : ce qu'est Osmose, qui y consulte, ce qui s'y passe bientôt."
      - texte: "À propos : l'ADN du lieu et sa raison d'être."
      - texte: >-
          Praticiens : qui consulte à Osmose, dans quelle discipline, et où le
          contacter.
      - texte: >-
          Événements : les ateliers et les soirées à venir, dans l'ordre, avec la
          photo de l'intervenant et l'horaire.
        tooltip: >-
          Les filtres par type d'événement attendront que le volume les rende
          utiles.
      - texte: >-
          Réserver le lieu : l'espace, ses dimensions et ce qu'on peut y faire,
          pour une entreprise, une association ou un particulier qui cherche où
          organiser son événement.
      - texte: >-
          Contact : ton numéro et ton adresse mail pour joindre Osmose.
    note: >-
      Compris dans tous les cas : responsive, configuration SEO, tests QA sur les
      3 navigateurs principaux, certificat SSL, hébergement et raccordement du nom
      de domaine, pages légales, doc de passation, support 30 jours après la mise
      en ligne.

  - titre: L'identité
    texte: >-
      Je te soumets trois pistes, tu en choisis une et on l'affine ensemble. Le
      vert et l'orange de tes flyers restent sur la table, resserrés.
    liste:
      - texte: "Le picto et le logotype, livrés en fichiers vectoriels."
        tooltip: >-
          Agrandissables à n'importe quelle taille sans perte de qualité, de la
          favicon à une banderole de trois mètres.
      - texte: >-
          La palette et les deux typographies retenues, avec leurs règles d'usage
          sur une page.
      - texte: >-
          Les fichiers prêts à donner à l'imprimeur.
    note: >-
      La devanture elle-même — banderole, lettres sur bois, enseigne murale — n'est
      pas dans cette proposition, et l'autorisation de la mairie reste de ton côté.
      Je fournis les fichiers, Tram ou quelqu'un d'autre pose.

  - titre: Le budget
    texte: >-
      Les cinq premières lignes forment le socle. Les suivantes se cochent et se
      décochent : le total suit.
    budget:
      lignes:
        - label: "**Identité de marque** : trois pistes, puis le picto, le logotype, la palette et les typographies"
          prix: 950
        - label: "**Contenus des six pages** : je rédige à partir de la trame que tu remplis"
          prix: 450
          tooltip: >-
            Je t'envoie une trame à compléter dans un simple fichier texte. Tu
            racontes le lieu avec tes mots, j'écris les pages et je les optimise
            pour Google. Tu ne pars pas de la page blanche.
        - label: "**Maquettes des six pages** : validées avant l'intégration"
          prix: 700
        - label: "**Le site et son espace d'administration** : tu ajoutes un praticien ou un événement toi-même"
          prix: 980
          tooltip: >-
            Le même outil que celui de setencorpsmieux.fr : tu l'administres déjà
            depuis juillet, il n'y a rien de neuf à apprendre.
        - label: "**Mise en ligne** : nom de domaine, hébergement, référencement, recette"
          prix: 250
        - label: "Une page dédiée par praticien, plutôt qu'un bloc sur la page commune"
          prix: 450
          optionnel: true
          defaut: false
          tooltip: >-
            Une adresse propre à chacun, qu'il peut donner à ses propres clients.
        - label: "Formulaire de demande sur la page « Réserver le lieu »"
          prix: 250
          optionnel: true
          defaut: false
          tooltip: >-
            La page fonctionne sans : on s'en tient à ton numéro et à ton adresse
            mail le temps de voir si les demandes arrivent.
        - label: "Fiche Google de l'établissement : horaires, photos, catégories, avis"
          prix: 180
          optionnel: true
          defaut: false
          tooltip: >-
            C'est par là qu'on cherche un lieu à Sète, bien avant le site.
      remises:
        - label: Tarif association
          pct: 25
        - label: Geste pour l'ouverture du lieu
          pct: 30
      mention: HT
      reglement: >-
        30 % à la validation, qui lance le travail. Le solde à la mise en ligne, en
        une ou plusieurs fois : on cale les échéances ensemble.

  - titre: Le déroulé
    planning:
      options:
        - label: Calendrier
          texte: >-
            Le logo est livré le 18 septembre. Tu as trois semaines pour faire
            imprimer l'enseigne et la poser avant le 9 octobre.
          jalons:
            - { date: "11 sept.", label: "Tu me donnes ta réponse", owner: client }
            - { date: "12 → 19 sept.", label: "Tu remplis la trame et tu m'envoies les photos", owner: client }
            - { date: "14 sept.", label: "Trois pistes d'identité présentées", owner: coolbeans }
            - { date: "16 sept.", label: "Tu choisis une piste, ou tu demandes un autre angle", owner: client }
            - { date: "18 sept.", label: "Logo, palette et fichiers livrés, prêts pour l'imprimeur", owner: coolbeans }
            - { date: "30 sept.", label: "Maquettes des six pages", owner: coolbeans }
            - { date: "2 oct.", label: "Tu valides les maquettes", owner: client }
            - { date: "5 → 9 oct.", label: "Intégration et espace d'administration", owner: coolbeans }
            - { date: "14 oct.", label: "Tu parcours le site et tu me fais tes retours", owner: client }
            - { date: "20 oct.", label: "Mise en ligne", owner: coolbeans }
          note: >-
            Ces dates supposent ta réponse d'ici le 11 septembre. Un retard de
            validation décale la suite de plus que le retard lui-même : je travaille
            sur d'autres projets entre-temps et je reprends au créneau suivant.

  - titre: De ton côté
    texte: >-
      Trois choses, et ce sont elles qui font tenir le calendrier.
    liste:
      - texte: >-
          La trame que je t'envoie, remplie, les photos des praticiens et celles
          de l'espace.
      - texte: >-
          Une seule personne qui tranche. Montre les maquettes aux praticiens autant
          que tu veux, mais c'est toi qui me réponds, d'une seule voix.
        tooltip: >-
          Arbitrer entre quatre ou cinq avis contradictoires est le seul poste
          capable de faire déraper un projet de cette taille.
      - texte: >-
          Une réponse sous cinq jours ouvrés à chaque validation. Sans retour, je
          considère l'étape validée et j'avance.
    note: >-
      Deux allers-retours sont prévus par livrable. Au-delà, on en reparle avant que
      je continue.

notes:
  - tone: success
    texte: >-
      Tarif association de 25 %, puis un geste de 30 % pour l'ouverture du lieu.
      Les deux s'appliquent à l'ensemble, options comprises : tu règles un peu
      moins de la moitié du montant.
  - texte: >-
      Aucun abonnement mensuel : l'hébergement et l'espace d'administration tiennent
      dans les offres gratuites. Seul le nom de domaine se renouvelle, autour de dix
      euros par an.
  - texte: >-
      Pour plus tard, si le lieu tourne : filtres sur les événements, inscription en
      ligne aux ateliers, accès pour que chaque praticien tienne sa propre page. Rien
      n'est chiffré ici, et rien ne l'empêche.
  - texte: >-
      Proposition valable 30 jours.
