            - { date: 02/09 → 11/09, label: Intégration et développement, owner: coolbeans }
            - {
                date: Lun 14/09,
                label: "Migration des contenus (offerte, via Claude Code)",
                owner: coolbeans,
              }
            - { date: 15 → 16/09, label: Tests cross-device et performances, owner: coolbeans }
            - {
