titre: En Haut x Coolbeans
objet: Refonte du site Internet d'En Haut
date: 2026-08-05
contact: Simon
linear:
  affaire: https://linear.app/coolbeans-hq/issue/CRM-22

sections:
  - titre: Objectif
    texte: >-
      Conception et développement d'un **site moderne, sur la base de
      l'existant** (refonte), reprenant et modernisant l'identité visuelle
      actuelle d'En Haut, pour une meilleure lisibilité et une hiérarchie
      plus claire.

  - titre: Pages
    texte: "**8 pages facturées** + 1 offerte (le template 2), soit 4 templates reproductibles au total :"
    liste:
      - Accueil
      - Projets (liste des projets)
      - "Projet, template 1 (reproductible)"
      - "Projet, template 2 (reproductible, offert)"
      - "Projet, template 3 (reproductible)"
      - "Projet, template Photographies (reproductible)"
      - Prestations (liste des prestations)
      - "À propos / Qui sommes-nous ? (équipe, valeurs, ADN)"
      - À propos / Les ateliers d'En Haut
    diagram:
      image: /devis/en-haut-sitemap-v2.png
      alt: Sitemap proposé pour En Haut, version actuelle

  - titre: Fonctionnalités
    liste:
      - Slider avant/après moderne et agréable à utiliser
      - "Intégration de cartes interactives pour contextualiser un projet : **à voir ensemble**"

  - titre: Stack technique
    texte: >-
      On part sur **Astro** (développement) + **Sanity** (CMS) +
      **Cloudflare** (hébergement).
    liste:
      - Pages ultra-légères, site rapide
      - "Coût d'usage nul : hébergement Cloudflare gratuit, aucun abonnement mensuel"
      - "Autonomie : Simon gère textes, images et projets directement via Sanity, sans toucher au code"
      - >-
        Simon reste libre : le code est dans un dépôt qui lui appartient, le
        contenu Sanity est exportable, n'importe quel dev peut reprendre le
        site
      - Pas de plugins ni de mises à jour à gérer, contrairement à WordPress

  - titre: Budget
    budget:
      lignes:
        - label: >-
            Refonte complète : conception UX/UI + développement de 8 pages
            facturées (wireframes, maquettes, intégration) · 350 € / page,
            + 1 page offerte (le template 2)
          prix: 2800
        - label: Architecture technique
          prix: 450
        - label: Points hebdos de 30 min à 1 h jusqu'à la livraison
      mention: HT
      reglement: >-
        **30 %** à la signature du devis (lance la prestation, réserve les
        créneaux dans mon planning) · **40 %** à mi-projet · **30 %** de
        solde.

  - titre: Ce que ça comprend
    liste:
      - Responsive (desktop, tablette, mobile)
      - Configuration SEO et bonnes pratiques
      - Optimisation de la vitesse
      - Tests QA sur les 3 navigateurs principaux
      - Setup tracking + GA4
      - Certificat SSL, hébergement et DNS
      - Pages légales et page de contact
      - Doc de passation pour la prise en main du CMS
      - Support 30 jours après mise en ligne

  - titre: En option
    liste:
      - >-
        **Migration des contenus : offerte, pour l'ensemble des projets
        existants de Simon.** Je m'appuie sur Claude Code pour analyser chaque projet
        et le faire correspondre aux nouveaux templates (textes et images).
        Je ne peux pas garantir que
        le résultat (titres, paragraphes) corresponde exactement à ce que
        Simon a en tête : si des ajustements sont nécessaires, soit Simon les
        fait, soit je les budgète au temps passé.

  - titre: Planning
    planning:
      options:
        - label: Démarrage immédiat (10 août)
          texte: >-
            Planning proposé avec un point de cadrage et présentation des
            premiers wireframes le **lundi 10 août**, juste avant son départ.
            Ses retours pendant ce rendez-vous suffisent pour que j'avance
            seul pendant son absence du 11 au 17 août.
          jalons:
            - {
                date: Lun 10/08,
                label: "Cadrage et présentation des wireframes V1 (retours en direct)",
              }
            - { date: Ven 14/08, label: Wireframes V2 (ajustements), owner: coolbeans }
            - {
                date: Ven 21/08,
                label: Maquettes UI V1 (pages clés + 1 template),
                owner: coolbeans,
