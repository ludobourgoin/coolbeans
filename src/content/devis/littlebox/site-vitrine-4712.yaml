titre: LittleBox x Coolbeans
objet: Création du site vitrine de LittleBox
date: 2026-03-02
contact: Philippe

envoi:
  date: 2026-03-02
  destinataire: philippe.bartholi@gmail.com

linear:
  projet: https://linear.app/coolbeans-hq/project/site-vitrine-littlebox-e181c8e92c1f
  affaire: https://linear.app/coolbeans-hq/issue/CRM-26

sections:
  - titre: Objectif
    texte: >-
      Tes réalisations sont ton meilleur argument : le site les montre en
      grand, avec une page par projet. Les trois activités sont séparées
      pour qu'un client tombe directement sur celle qui le concerne.
    note: >-
      La direction artistique et les maquettes, c'est Hugo (BYHUS) : il te
      les facture directement. Ce devis ne couvre que ma partie.

  - titre: Pages
    liste:
      - Accueil
      - "Trois pages secteur : design d'espace, IDA, scénographie événementielle"
      - texte: Page projet, gabarit reproductible
        tooltip: >-
          C'est le gabarit que tu réutilises pour publier chaque nouvelle
          réalisation, sans repasser par moi.
      - À propos
      - Contact
      - Mentions légales et RGPD
    note: >-
      Hugo maquette quatre pages : l'accueil, une page secteur, une page
      projet et À propos. Les deux autres secteurs reprennent le même
      gabarit, Contact et les pages légales sont montées sur des structures
      standards.

  - titre: Fonctionnalités
    liste:
      - 8 à 12 projets en ligne au lancement, une dizaine de photos et une ou deux vidéos chacun
      - Un projet publié apparaît tout seul sur la page de son secteur
      - Formulaire de contact relié à ta boîte mail
      - texte: Contenu entièrement modifiable, textes et images
        tooltip: >-
          Depuis un ordinateur comme depuis un téléphone. Tu publies un
          projet, le site se met à jour tout seul.
    note: >-
      Après la formation, tu en ajoutes autant que tu veux. Ma reco : 4 à 6
      projets par secteur, les plus parlants.

  - titre: Stack technique recommandée
    texte: >-
      **Astro** pour le site, **Sanity** pour le contenu, **Cloudflare** pour
      l'hébergement.
    liste:
      - Aucun abonnement mensuel, l'hébergement et le CMS sont gratuits à ce volume
      - Le code t'appartient, le contenu s'exporte, n'importe quel développeur peut reprendre le site
      - Pas de plugins ni de mises à jour de sécurité à gérer
    note: >-
      J'avais prévu Webflow au départ. Cette stack fait la même chose, avec
      la même souplesse et de meilleures performances, mais sans les 21 €
      par mois d'abonnement : environ 250 € économisés chaque année. Seul le
      nom de domaine reste à ta charge, une dizaine d'euros par an.

  - titre: Budget
    budget:
      lignes:
        - label: >-
            Cadrage et structure : wireframes de chaque page, hiérarchie de
            l'information, parcours visiteur
        - label: "Intégration : gabarits, CMS, responsive, performances"
          prix: 2500
        - label: Nom de domaine, consentement et référencement
          prix: 500
      mention: HT
      reglement: >-
        **30 %** à la commande, **70 %** à la livraison et validation du site
        fonctionnel.

  - titre: Ce que ça comprend
    liste:
      - Responsive (desktop, tablette, mobile)
      - Configuration SEO et bonnes pratiques
      - Optimisation des web perfs (vitesse, Core Web Vitals…)
      - Tests QA sur les 3 navigateurs principaux
      - Setup tracking et bandeau de consentement
      - Certificat SSL, hébergement et DNS
      - Formation à la prise en main du CMS

  - titre: De ton côté
    liste:
      - Logos, photos HD et vidéos des réalisations, en fichiers sources
      - Le choix des projets à mettre en ligne
      - Les textes des pages et des projets
      - Les informations légales de la société
      - Validation de la direction visuelle, puis des maquettes
      - Un seul référent pour les retours
    note: >-
      Sur les textes je t'accompagne : structure, titres, accroches, longueur
      des sections, et je te propose des reformulations. Je ne rédige pas
      tout à ta place, tu es le mieux placé pour parler de ton métier.

  - titre: Planning
    planning:
      options:
        - label: Mise en ligne le 1er avril
          texte: >-
            Le calendrier tient si les retours arrivent aux dates prévues.
            Les créneaux d'intégration sont réservés à l'avance.
          jalons:
            - { date: Mer 14/01, label: Kick-off tous les trois }
            - { date: Ven 13/02, label: Zoning et bases du contenu, owner: coolbeans }
            - { date: Dim 15/02, label: "Premiers assets : logos, photos HD, vidéos", owner: client }
            - { date: Lun 02/03, label: Maquettes des pages principales }
            - { date: Ven 06/03, label: Retours sur les maquettes, owner: client }
            - { date: Ven 06/03, label: Tous les assets restants, owner: client }
            - { date: Ven 13/03, label: Livraison des maquettes }
            - { date: Ven 27/03, label: Intégration des pages, owner: coolbeans }
            - { date: Mar 31/03, label: Configuration SEO et optimisations, owner: coolbeans }
            - { date: Mer 01/04, label: Mise en ligne, owner: coolbeans }
            - { date: Courant avril, label: Formation à la prise en main du CMS }

notes:
  - texte: >-
      Deux cycles de retours : un sur les wireframes et la structure, un sur
      les maquettes. Puis une session de retours sur le site intégré, avant
      la livraison.
  - texte: >-
      Un retard de validation peut décaler la livraison de plus que le retard
      lui-même : les créneaux d'intégration sont réservés à l'avance.
