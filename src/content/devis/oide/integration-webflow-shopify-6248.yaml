# Reconstitution rétroactive du devis Tiime n° 004329 du 19/03/2026, écrite le
# 2026-09-01 pour que le cockpit /espace/devis porte toutes les affaires
# signées. Les lignes et les montants sont ceux du PDF émis, à l'euro près ;
# seules la mise en forme et les sections rédigées sont d'aujourd'hui.
titre: Oïde x Coolbeans
objet: Intégration Webflow x Shopify · boutique Oïde
date: 2026-03-19
contact: Margaux
# Affaire déjà signée : la page sert de feuille de route à Margaux et
# Clément, pas de proposition à valider.
formulaire: false
linear:
  projet: Intégration Shopify
  affaire: https://linear.app/coolbeans-hq/issue/CRM-30
# Pas de bloc `envoi` : le devis est forcément parti, l'affaire est signée,
# mais aucune trace Gmail ne dit à qui ni quand. Une date inventée vaudrait
# moins qu'un trou assumé — le cockpit affichera « Non envoyé », ce qui est
# faux mais visible, là où une fausse date serait fausse et invisible.

sections:
  - titre: Ce que j'ai compris
    texte: >-
      Oïde lance sa boutique en ligne.
    liste:
      - texte: >-
          **Neuf pages au total** : deux pages avancées, trois pages standard,
          et un lot de pages de service
      - texte: >-
          J'intègre à partir de vos maquettes. La direction artistique et la
          production des écrans restent chez Margaux.
      - texte: >-
          Les contenus (textes, visuels produits, fiches) sont fournis par vos
          soins, prêts à l'emploi.

  - titre: Pages
    liste:
      - texte: >-
          **Accueil** et **template produit** : les deux pages avancées, celles
          qui portent la conversion
        tooltip: >-
          Le template produit est construit une fois et sert toutes les
          références du catalogue Shopify.
      - texte: "**Liste des produits** et les deux pages **À propos** · pages standard"
      - texte: "**Contact** et les **quatre pages légales** · pages de service"

  - titre: Budget
    budget:
      lignes:
        - label: "**Accueil** et **template produit** · intégration avancée"
          prix: 2200
          tooltip: 1 100 € par page.
        - label: "**Liste produits** et **À propos** (x2) · intégration standard"
          prix: 1950
          tooltip: 650 € par page.
        - label: "**Contact** et **pages légales** (x4) · intégration basique"
          prix: 700
        - label: >-
            **Intégration custom (pack 10 h)** : configuration Shopify, mise en
            place de Smootify, référencement, analytics et web perfs
          prix: 750
        - label: >-
            **Maintenance (plan Starter, 12 mois)** : jusqu'à 3 h par mois
            d'évolutions et d'ajustements
          prix: 2520
          tooltip: 210 € par mois, soit 70 € de l'heure.
      mention: HT
      reglement: >-
        **30 %** à la signature, qui réserve les créneaux dans mon planning.
        **70 %** dans les 30 jours suivant la livraison du site fonctionnel.
        TVA de 20 % en sus, soit **9 744,00 € TTC**.

  - titre: Ce que ça comprend
    liste:
      - Responsive (ordinateur, tablette, mobile)
      - Configuration SEO et bonnes pratiques
      - Optimisation des web perfs (vitesse, Core Web Vitals…)
      - Tests QA sur les 3 navigateurs principaux
      - Setup tracking
      - Certificat SSL, hébergement et raccordement du nom de domaine
      - Pages légales et page de contact
      - Doc de passation pour la prise en main de Webflow et de Shopify

  - titre: Planning
    planning:
      options:
        - label: Intégration en novembre-décembre
          texte: "Site fonctionnel prêt pour lancement le **10 décembre 2026**."
          jalons:
            - { date: 30/10, label: "Livraison des maquettes Figma finalisées et des contenus (catalogue, textes, visuels)", owner: client }
            - { date: 02/11 → 13/11, label: "Intégration des neuf pages et raccordement du catalogue produits", owner: coolbeans }
            - { date: 16/11 → 18/11, label: "SEO, tracking, optimisation des performances et recette", owner: coolbeans }
            - { date: 01/12 → 05/12, label: "Derniers ajustements et mise en production", owner: coolbeans }
            - { date: 10/12, label: "Site fonctionnel prêt pour lancement", owner: coolbeans }
          note: >-
            Le calendrier tient à la date de livraison des maquettes et des
            contenus. Un retard sur celle-ci décale le lancement d'autant.

notes:
  - texte: >-
      Les abonnements aux outils (Shopify...) sont souscrits et réglés par
      vos soins. Ils ne sont pas compris dans ce devis.
  - tone: warning
    texte: >-
      Ce devis chiffre l'intégration à partir de maquettes fournies par
      Margaux. La direction artistique, la production des écrans et
      leurs corrections ne sont pas comprises.
