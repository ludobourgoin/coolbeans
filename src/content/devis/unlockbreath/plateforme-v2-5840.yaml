titre: UnlockBreath x Coolbeans · V2
objet: Avenant au devis de février 2026 · reprise de la plateforme sur une base sur-mesure
date: 2026-10-01
contact: Thierry
tutoiement: true
version: 2
versionDe: unlockbreath/plateforme-3271
linear:
  projet: Plateforme UnlockBreath
  affaire: https://linear.app/coolbeans-hq/issue/CRM-24

sections:
  - titre: Pourquoi cet avenant
    texte: >-
      Les maquettes de la plateforme ont changé de main et évoluent encore.
      Comme **aucune page n'a été intégrée à ce jour**, le moment est le bon
      pour réexaminer la base technique avant de construire : c'est la dernière
      fenêtre où ce choix ne coûte rien.
    liste:
      - texte: >-
          **Rien de ce que tu as versé n'est perdu.** Le budget déjà réglé
          s'impute intégralement sur cet avenant.
      - texte: >-
          Le périmètre fonctionnel ne bouge pas : mêmes onze pages, mêmes deux
          offres, même programme en sept semaines, mêmes six langues.
      - texte: >-
          Ce qui change, c'est **la manière de le construire**, et ce que la
          plateforme te coûtera chaque mois une fois en ligne.
    note: >-
      Cet avenant remplace le volet développement du devis n° 004326 du
      2 février 2026. La note de cadrage contractuelle du 7 février reste en
      vigueur pour tout ce qui n'est pas modifié ici.

  - titre: Ce que tu y gagnes
    liste:
      - texte: >-
          **Les abonnements prévus disparaissent.** Webflow, Memberstack, Make
          et Webflow Localize ne sont plus nécessaires : de l'ordre de
          **1 000 € par an** que tu n'auras pas à payer.
        tooltip: >-
          Avec la base de février : Webflow 20 à 34 €, Memberstack 25 à 45 €,
          Make 15 €, Localize 8 € par langue supplémentaire, soit 100 à 134 €
          par mois. Avec la nouvelle base : 5 à 50 € par mois. Le détail est
          dans la section « Ce que tu paies chaque mois ».
      - texte: >-
          **The course et le Dashboard cessent d'être bridés.** Le déblocage
          progressif des semaines, le suivi de progression, la reprise là où
          l'utilisateur s'est arrêté : ce sont les écrans qui font ton
          produit, et ce sont ceux que Webflow et Memberstack auraient rendus
          les plus contraints.
      - texte: >-
          **La plateforme t'appartient entièrement.** Le code est dans un dépôt
          à ton nom, les données sont dans ta base, aucun éditeur ne peut
          modifier ses conditions ou ses tarifs sous tes pieds.
      - texte: >-
          **Elle est plus rapide.** Les pages sont servies pré-construites
          depuis un réseau mondial, ce qui compte pour des utilisateurs répartis
          sur six langues et plusieurs continents.

  - titre: Tu restes autonome sur ton contenu
    texte: >-
      C'était un engagement du cadrage de février, il est tenu. Tu disposes
      d'un **espace d'administration** dédié, séparé du site, dans lequel tu
      modifies toi-même :
    liste:
      - Les textes de toutes les pages, dans chacune des six langues
      - Les articles de Science of Breathing, leurs images et leurs tags
      - Les questions-réponses de la FAQ
      - Le contenu des sept semaines du programme, et les liens vidéo associés
      - Les libellés et destinations des boutons d'action
    note: >-
      Formation à l'outil et guide écrit remis à la livraison, comme prévu au
      cadrage initial. Ce qui relève du code (une nouvelle page, une nouvelle
      fonctionnalité) reste de mon ressort, exactement comme avec Webflow.

  - titre: Socle technique
    texte: >-
      **Next.js** (développement) + **Sanity** (gestion de contenu) +
      **Cloudflare** (hébergement, base de données et fichiers) + **Loops**
      (emails). bunny.net et Stripe sont conservés à l'identique.
    liste:
      - texte: >-
          **Comptes et accès** : inscription, connexion, mot de passe oublié,
          connexion Google et Facebook, et le verrouillage du programme payant
        tooltip: >-
          C'est ce que devait faire Memberstack. Construit sur mesure, il n'y a plus
          d'abonnement mensuel et plus de limite au nombre de membres.
      - texte: >-
          **Paiement Stripe** : les deux offres, le paiement comptant et le
          paiement fractionné, l'ouverture automatique de l'accès après
          règlement
      - texte: >-
          **Emails** : bienvenue, confirmation de paiement, anticipation de fin
          d'accès à 6 et 18 mois, progression et fin de chapitre
      - texte: >-
          **Vidéo** : lecteur bunny.net, avec des liens qui ne fonctionnent que
          pour un membre dont l'accès est actif
      - texte: "**Multilingue** : une adresse par langue, contenus traduits gérés depuis l'administration"

  - titre: Budget
    texte: Un prix global pour la plateforme complète, en trois postes.
    budget:
      lignes:
        - label: >-
            **Le site qui présente et vend ton programme** : les pages
            publiques en six langues, le paiement Stripe comptant ou
            fractionné, l'ouverture automatique de l'accès
          prix: 4750
          tooltip: >-
            Accueil, Science of Breathing, Your Physiotherapist Guide, Program,
            FAQ, Contact et pages légales. Référencement technique, mesure
            d'audience et bandeau de consentement compris.
        - label: >-
            **L'espace membre** : comptes et connexion, le programme en sept
            semaines avec déblocage progressif, les vidéos réservées aux
            membres, les emails qui accompagnent chaque élève
          prix: 4300
          tooltip: >-
            Connexion par email, Google ou Facebook. Tableau de bord, suivi de
            progression, reprise là où l'élève s'est arrêté, réglages du compte.
            Emails de bienvenue, de confirmation de paiement, de progression et
            d'anticipation de fin d'accès.
        - label: >-
            **Ton autonomie** : l'espace d'administration de tous les contenus
            et de leurs traductions, et la mise en ligne
          prix: 1400
          tooltip: >-
            Tu modifies toi-même textes, articles, FAQ et programme, dans chaque
            langue. Mise en place des environnements de test et de production,
            du domaine et du certificat.
      remises:
        - { label: Prix du devis de février maintenu, montant: 1504 }
      mention: HT
      reglement: >-
        **L'acompte de 2 683,80 € HT déjà versé s'impute intégralement sur ce
        montant.** Aucune page n'ayant été produite, rien de ce que tu as versé
        n'est consommé. **Reste dû : 6 262,20 € HT**, selon le même échéancier
        qu'en février : la moitié au démarrage, la moitié au plus tard 30 jours
        après la livraison. TVA de 20 % en sus.

  - titre: Ce que ça comprend
    liste:
      - Responsive (ordinateur, tablette, mobile)
      - Configuration SEO et bonnes pratiques
      - Optimisation de la vitesse d'affichage
      - Tests sur les trois principaux navigateurs
      - Certificat SSL, hébergement et raccordement du nom de domaine
      - Formation à la mise à jour du contenu, et guide écrit remis à la livraison
      - Document de passation technique
      - Support 30 jours après la mise en ligne

  - titre: Ce que tu paies chaque mois
    texte: >-
      Ces coûts sont facturés directement par les éditeurs, ils ne transitent
      pas par moi. C'est là que se joue l'économie de l'opération.
    liste:
      - texte: >-
          **Avec la base de février : 100 à 134 € par mois.** Webflow 20 à
          34 €, Memberstack 25 à 45 €, Make 15 €, Webflow Localize 40 € pour
          les cinq langues supplémentaires.
        tooltip: >-
          La fourchette haute correspond aux plans nécessaires pour ton volume
          de membres et tes six langues.
      - texte: >-
          **Avec la nouvelle base : 5 à 50 € par mois.** Hébergement, base de
          données et fichiers chez Cloudflare 5 €, gestion de contenu Sanity
          0 €, emails Loops 0 à 45 €.
        tooltip: >-
          Cloudflare en offre payante, qui couvre l'hébergement, la base de
          données et le stockage des fichiers. Sanity est gratuit jusqu'à un
          volume de contenu et un nombre d'éditeurs que tu n'atteindras pas.
          Loops est gratuit jusqu'à 1 000 contacts, avec sa signature en bas
          des emails, puis 49 $ par mois jusqu'à 5 000 contacts. Le logiciel de
          gestion des comptes est libre et sans abonnement, contrairement à
          Memberstack.
      - texte: >-
          **Inchangés dans les deux cas** : bunny.net, facturé à l'usage, les
          commissions Stripe et ton nom de domaine.
    note: >-
      **Économie : de 84 à 95 € par mois, soit de 1 010 à 1 140 € par an.**
      Le prix de la prestation ne change pas : l'économie te revient en
      entier, dès la mise en ligne.

  - titre: Ce dont j'ai besoin de toi, et quand
    liste:
      - texte: >-
          **Les maquettes complètes et validées, avant le démarrage.** Toutes
          les pages, dans leurs trois tailles d'écran, avec les états
          d'interface.
        tooltip: >-
          C'est la condition qui porte tout le planning. J'intègre à partir de
          maquettes produites par ton équipe de design : tant qu'un écran
          manque ou change, la page correspondante ne peut pas être construite,
          et le calendrier se décale d'autant.
      - texte: >-
          **Les fichiers vidéo du programme en anglais**, leurs sous-titres et
          leur organisation par chapitre
      - texte: >-
          **Les contenus éditoriaux** : page d'accueil validée, questions de la
          FAQ, textes de Your Physiotherapist Guide
      - texte: >-
          **Les accès** : Stripe, bunny.net, YouTube, Google Analytics, le nom
          de domaine, tes comptes Cloudflare et Loops
      - texte: >-
          **Les textes juridiques revus par ton avocat**, avant la mise en
          ligne
    note: >-
      Sans retour de ta part sous 5 jours ouvrés, un livrable est considéré
      comme validé. La mise en production reste conditionnée à ton Go écrit
      à l'issue de la recette.

  - titre: Planning
    planning:
      options:
        - label: À partir de la réception des maquettes
          texte: >-
            Le calendrier se déclenche à la **réception des maquettes
            complètes**, pas à la signature de cet avenant.
          indicatif: true
          jalons:
            - { date: Semaine 1, label: "Mise en place du projet, des environnements et de l'espace d'administration", owner: coolbeans }
            - { date: Semaines 2-3, label: "Intégration des pages vitrines : Accueil, Science of Breathing, Your Physiotherapist Guide, FAQ, Contact, pages légales", owner: coolbeans }
            - { date: Semaines 3-4, label: "Comptes, accès et paiement Stripe", owner: coolbeans }
            - { date: Semaines 4-5, label: "Espace membre : Dashboard, The course, Settings, et le programme en sept semaines", owner: coolbeans }
            - { date: Semaine 6, label: "Emails, multilingue, analytics et référencement", owner: coolbeans }
            - { date: Semaine 7, label: Recette sur la pré-production, owner: client }
            - { date: Semaine 8, label: "Corrections, mise en production sur ton Go écrit, formation", owner: coolbeans }
          note: >-
            Huit semaines de travail à compter de maquettes complètes. Les
            semaines se chevauchent en partie : le total calendaire dépend du
            rythme de tes retours.

notes:
  - tone: info
    texte: >-
      **Le prix du devis de février est maintenu : 8 946 € HT.** La nouvelle
      base demande plus de travail. L'écart est à ma charge.
  - texte: >-
      Le périmètre fonctionnel V01 est inchangé. Les éléments renvoyés à une
      V02 en février (sous-catégories de Science of Breathing, langues
      asiatiques) le restent.
  - tone: warning
    texte: >-
      Ce devis chiffre l'intégration à partir de maquettes fournies par ton
      équipe de design. La direction artistique, la production des écrans et
      leurs corrections ne sont pas comprises.
