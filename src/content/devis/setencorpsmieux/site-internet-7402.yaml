# Reconstitution rétroactive, écrite le 2026-09-01. Aucun devis n'a jamais été
# émis pour ce projet : les postes viennent du dépôt Git (30 commits du
# 2026-06-10 au 2026-08-13), des échanges Gmail et des issues Linear de la team
# SET.
#
# Chiffrage : PAS de temps × TJM. Le site a été produit vite (brief vers Claude
# Design pour la maquette, validation cliente, puis Claude Code pour
# l'intégration, Ludo en chef d'orchestre) et le temps humain réel est faible.
# Le prix est celui du marché pour un site comparable vendu à un commerce local
# — repères internes : LittleBox 3 000 €, En Haut 3 250 €, CAFA 2 000 €. Base
# retenue 3 500 € HT, répartie sur les postes par la valeur livrée et non par
# les heures passées. Tarif ami de -50 % appliqué sur le total.
#
# Rechiffré le 2026-10-02, avant tout envoi, en deux temps. En juin, Ludo avait
# dit à Nathalie de vive voix « normalement 1 500 à 2 000 €, je te fais 50 % ».
# Nathalie détient aussi la proposition OSMOSE : Ludo a voulu que les tarifs
# AVANT réduction soient alignés entre les deux. Base recalculée sur la grille
# d'Osmose V2 : maquettes 950 (700 € les 6 pages, ramené à 8), site et Studio 980,
# pages de prestation 450 (prix de l'option « page par praticien »), mise en
# ligne 250, planning 400 (sans équivalent chez Osmose, prix de l'ancienne base),
# contenus 0 (textes fournis par elle). Total 3 030 €. Tarif ami fixé par Ludo à
# 75 %, soit 757,50 € HT. Une seule ligne au budget : le détail ne servait qu'à
# être comparé à Osmose. Comparatif : claude.ai/artifact/CxLLPEyZaMvz7XHymrDABv
#
# Une partie du règlement se fera en séances (Pilates, massages). Ludo s'arrange
# avec elle directement : volontairement absent de cette page. La facture Tiime
# porte quand même le montant entier, TVA comprise.
#
# Après réduction, setencorpsmieux (757,50 €) reste sous Osmose V2 (1 160,25 €)
# pour un site plus gros : l'écart tient au geste, tarif ami contre tarif
# association et ouverture du lieu.
titre: Sète En Corps Mieux x Coolbeans
objet: Site setencorpsmieux.fr
date: 2026-10-02
projet: refonte-740
etape: proposition
contact: Nathalie
linear:
  projet: Refonte du site Sète En Corps Mieux

sections:
  - titre: Le projet
    texte: >-
      Remplacer l'ancien site par un site que tu tiens toi-même, sans abonnement
      mensuel et sans dépendre de personne pour changer un texte, une photo ou un
      créneau de cours.
    liste:
      - texte: >-
          Huit pages, cinq prestations (Pilates, Do-In, Gym sénior, Amma assis,
          Shiatsu de confort) et un planning de la semaine.
      - texte: >-
          Le contenu vit dans un espace d'administration en français, accessible
          depuis un ordinateur comme depuis un téléphone.
      - texte: >-
          Tu as fourni les textes, les tarifs, le planning et les photos entre le
          5 et le 23 juillet. J'ai fait le reste.

  - titre: Le site
    liste:
      - texte: >-
          Accueil, À propos, Planning, Contact, plus les mentions légales et la
          politique des cookies.
      - texte: >-
          Une page par prestation, générée automatiquement : tu en ajoutes une,
          la page existe.
        tooltip: >-
          Même chose côté articles : le blog est prêt, il n'attend que du contenu.
      - texte: >-
          Un planning hebdomadaire avec les cours, les ateliers et les
          permanences, filtrables par activité.
      - texte: >-
          Vingt-et-un blocs réutilisables (bienfaits, formats, tarifs, appel à
          l'action) que tu recombines sans toucher au code.

  - titre: Ce que tu modifies toi-même
    texte: >-
      Dix types de contenu ont été modélisés dans le Studio, avec des libellés en
      français et une structure qui empêche les fausses manœuvres.
    liste:
      - "Les textes et les images de chaque page"
      - "Les prestations, leurs formats, leurs tarifs et leurs bienfaits"
      - "Les cours, les ateliers et les permanences du planning"
      - "Les titres et descriptions vus par Google"
    note: >-
      À chaque publication depuis le Studio, le site se reconstruit et se met en
      ligne tout seul. Aucune intervention de ma part n'est nécessaire.

  - titre: Le budget
    budget:
      lignes:
        - label: "**Le site setencorpsmieux.fr**, livré et en ligne depuis le 4 septembre"
          prix: 3030
          tooltip: >-
            Les maquettes des huit pages, le site et son espace d'administration,
            une page par prestation, le planning hebdomadaire et la mise en ligne,
            sortie du domaine de chez Ionos comprise. Retours, responsive et
            recette compris.
      remisePct: 75
      remiseLabel: Tarif ami
      mention: HT
      reglement: >-
        Modalités à convenir ensemble. Rien n'a été facturé à ce jour. TVA de 20 % en sus.

  - titre: Le déroulé
    planning:
      options:
        - label: Ce qui s'est passé
          texte: "Deux mois et demi de travail, de juin à fin août 2026."
          jalons:
            - { date: 10/06, label: "Fondations techniques et hébergement", owner: coolbeans }
            - { date: 05/07 → 23/07, label: "Textes, tarifs, planning et photos transmis", owner: client }
            - { date: 30/07, label: "Site complet livré, design intégré", owner: coolbeans }
            - { date: 31/07, label: "Passage responsive et recette sur quatre largeurs", owner: coolbeans }
            - { date: 01/08, label: "Première ronde de retours", owner: client }
            - { date: 02/08 → 11/08, label: "Retours intégrés, nouveau planning hebdomadaire", owner: coolbeans }
            - { date: 13/08, label: "Deuxième ronde de retours", owner: client }
            - { date: 27/08, label: "Nom de domaine sorti d'Ionos et rapatrié", owner: coolbeans }
            - { date: 04/09, label: "Site en ligne sur setencorpsmieux.fr", owner: coolbeans }

notes:
  - tone: success
    texte: >-
      Tarif ami de 75 % sur l'ensemble. Le montant plein est affiché pour que tu
      voies ce que représente le travail, pas pour te le faire payer.
  - texte: >-
      Aucun abonnement mensuel : l'hébergement et l'espace d'administration
      tiennent dans les offres gratuites. Seul le nom de domaine se renouvelle,
      autour de dix euros par an.
  - texte: >-
      J'ai avancé neuf francs suisses pour le transfert du domaine le 27 août.
      C'est le seul frais engagé pour l'instant.
  - texte: >-
      Le flyer, le kakemono et le travail sur le logo de 2025 ne sont pas
      comptés ici. Ils étaient offerts, ils le restent.
