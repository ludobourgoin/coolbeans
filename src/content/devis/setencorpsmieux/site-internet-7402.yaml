# Reconstitution rétroactive, écrite le 2026-09-01. Aucun devis n'a jamais été
# émis pour ce projet : les postes viennent du dépôt Git (30 commits du
# 2026-06-10 au 2026-08-13), des échanges Gmail et des issues Linear de la team
# SET.
#
# Chiffrage : PAS de temps × TJM. Le site a été produit vite (brief vers Claude
# Design pour la maquette, validation cliente, puis Claude Code pour
# l'intégration, Ludo en chef d'orchestre) et le temps humain réel est faible.
#
# Rechiffré le 2026-10-02, avant tout envoi. En juin, Ludo avait dit à Nathalie
# de vive voix « normalement 1 500 à 2 000 €, je te fais 50 % ». Nathalie détient
# aussi la proposition OSMOSE (V2, envoyée le 2026-09-08) : Ludo a voulu que les
# deux documents aient les mêmes sections, dans le même ordre, et les mêmes
# tarifs AVANT réduction. Base recalculée sur la grille d'Osmose V2 : contenus 0
# (textes fournis par elle), maquettes 950 (700 € les 6 pages, ramené à 8), site
# et Studio 980, pages de prestation 450 (prix de l'option « page par
# praticien »), planning 400 (sans équivalent chez Osmose, prix de l'ancienne
# base), mise en ligne 250. Total 3 030 €. Tarif ami fixé par Ludo à 75 %, soit
# 757,50 € HT. Comparatif : claude.ai/artifact/CxLLPEyZaMvz7XHymrDABv
#
# Sections calquées sur osmose/site-v2-5127.yaml. Vérifier avant tout commit :
#   diff <(grep "^  - titre:" osmose/site-v2-5127.yaml) <(grep "^  - titre:" setencorpsmieux/site-internet-7402.yaml)
#
# Une partie du règlement se fera en séances (Pilates, massages). Ludo s'arrange
# avec elle directement : volontairement absent de cette page. La facture Tiime
# porte quand même le montant entier, TVA comprise.
#
# Les 9 CHF du transfert du domaine (27 août) ont été remboursés par Nathalie
# directement. Reste à elle de remplacer la carte de Ludo chez Infomaniak.
titre: Sète En Corps Mieux x Coolbeans
objet: Site setencorpsmieux.fr
date: 2026-10-02
projet: refonte-740
etape: proposition
contact: Nathalie
linear:
  projet: Refonte du site Sète En Corps Mieux

sections:
  - titre: Ce que j'ai compris
    texte: >-
      Sète En Corps Mieux, c'est ton activité : Pilates, Do-In, Gym sénior, Amma
      assis et Shiatsu de confort, en cours collectifs et en séances
      individuelles.
    liste:
      - texte: >-
          Ton ancien site dépendait d'un webmaster et d'un abonnement chez Ionos.
      - texte: >-
          Changer un texte, une photo ou un créneau voulait dire demander, puis
          attendre.
      - texte: >-
          Ton planning change souvent : cours, ateliers, permanences.
    note: >-
      C'est sur ces trois points que le site a été construit.

  - titre: Ce que le site change
    liste:
      - texte: >-
          Tu changes toi-même un texte, une photo, un tarif ou un créneau, depuis
          ton ordinateur comme depuis ton téléphone, sans me demander.
      - texte: >-
          Le planning de la semaine se filtre par activité : chacun trouve son
          cours sans lire tout le reste.
      - texte: >-
          Chaque prestation a sa page, avec ses bienfaits, ses formats et ses
          tarifs. Tu en ajoutes une, la page existe.
      - texte: >-
          À chaque publication depuis le Studio, le site se met à jour tout seul,
          sans intervention de ma part.

  - titre: Le site
    liste:
      - texte: "Accueil, À propos et Contact, plus les mentions légales et la politique des cookies."
      - texte: >-
          Prestations : une page par activité, générée depuis sa fiche.
        tooltip: >-
          Même chose côté articles : le blog est prêt, il n'attend que du contenu.
      - texte: >-
          Planning : les cours, les ateliers et les permanences, filtrables par
          activité et navigables de semaine en semaine.
      - texte: >-
          Vingt-et-un blocs réutilisables (bienfaits, formats, tarifs, appel à
          l'action) que tu recombines sans toucher au code.
    note: >-
      Compris : responsive et recette sur quatre largeurs d'écran, certificat
      SSL, hébergement, sortie du domaine de chez Ionos et raccordement, pages
      légales, titres et descriptions pour Google modifiables dans le Studio.

  - titre: L'identité
    texte: >-
      Ton logo existait depuis 2025. Je l'ai décliné à l'écran : c'est le design
      du site.
    liste:
      - texte: >-
          J'ai posé la palette, les typographies et la mise en page des huit
          pages, version mobile comprise.
      - texte: >-
          Tu as validé les maquettes avant que j'intègre le site.
      - texte: >-
          J'ai complété ce qui manquait pour le web : favicon et icône pour
          l'écran d'accueil du téléphone.
    note: >-
      Le flyer, le kakemono et le travail sur le logo de 2025 ne sont pas comptés
      ici. Ils étaient offerts, ils le restent.

  - titre: Le budget
    texte: >-
      Le site tel qu'il est en ligne, poste par poste.
    budget:
      lignes:
        - label: "**Contenus** : tes textes, mis en forme dans le Studio"
          prix: 0
          tooltip: >-
            Tu as écrit tes textes et choisi tes photos. Je n'ai rien rédigé, ce
            poste ne compte donc pas.
        - label: "**Maquettes des huit pages** : validées avant l'intégration"
          prix: 950
        - label: "**Le site et son espace d'administration** : tu ajoutes une prestation ou un cours toi-même"
          prix: 980
          tooltip: >-
            Dix types de contenu, avec des libellés en français et une structure
            qui empêche les fausses manœuvres.
        - label: "**Une page par prestation**, générée depuis sa fiche"
          prix: 450
        - label: "**Le planning de la semaine** : filtres par activité, navigation de semaine en semaine"
          prix: 400
        - label: "**Mise en ligne** : nom de domaine, hébergement, recette"
          prix: 250
          tooltip: >-
            Sortie du domaine de chez Ionos, rapatriement, bascule de
            l'hébergement et publication automatique depuis le Studio.
      remisePct: 75
      remiseLabel: Tarif ami
      mention: HT
      reglement: >-
        Modalités à convenir ensemble. Rien n'a été facturé à ce jour. TVA de 20 %
        en sus.

  - titre: Le déroulé
    planning:
      options:
        - label: Ce qui s'est passé
          texte: "Deux mois et demi de travail, de juin à fin août 2026."
          jalons:
            - { date: 10/06, label: "Fondations techniques et hébergement", owner: coolbeans }
            - { date: 05/07 → 23/07, label: "Textes, tarifs, planning et photos transmis", owner: client }
            - { date: 30/07, label: "Site complet livré, design intégré", owner: coolbeans }
            - { date: 31/07, label: "Passage responsive et recette sur quatre largeurs", owner: coolbeans }
            - { date: 01/08, label: "Première ronde de retours", owner: client }
            - { date: 02/08 → 11/08, label: "Retours intégrés, nouveau planning hebdomadaire", owner: coolbeans }
            - { date: 13/08, label: "Deuxième ronde de retours", owner: client }
            - { date: 27/08, label: "Nom de domaine sorti d'Ionos et rapatrié", owner: coolbeans }
            - { date: 04/09, label: "Site en ligne sur setencorpsmieux.fr", owner: coolbeans }

  - titre: De ton côté
    texte: >-
      Ce que tu as fourni, et ce qui est désormais entre tes mains.
    liste:
      - texte: >-
          Les textes, les tarifs, le planning et les photos, transmis entre le 5
          et le 23 juillet.
      - texte: >-
          Tes retours, en deux rondes, le 1er et le 13 août.
      - texte: >-
          La mise à jour du site : textes, photos, prestations et planning se
          changent depuis le Studio.
      - texte: >-
          Le renouvellement du nom de domaine : remplace ma carte bancaire par
          la tienne chez Infomaniak, pour les années à venir.

notes:
  - tone: success
    texte: >-
      Tarif ami de 75 % sur l'ensemble. Le montant plein est affiché pour que tu
      voies ce que représente le travail, pas pour te le faire payer.
  - texte: >-
      Aucun abonnement mensuel : l'hébergement et l'espace d'administration
      tiennent dans les offres gratuites. Seul le nom de domaine se renouvelle,
      autour de dix euros par an.
  - texte: >-
      Pour plus tard, si tu en as besoin : la réservation en ligne des cours, avec
      une jauge et une liste d'attente. Rien n'est chiffré ici, et rien ne
      l'empêche.
