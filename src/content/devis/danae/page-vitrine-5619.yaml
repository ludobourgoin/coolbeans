titre: Vice Versa x Coolbeans
objet: Une page vitrine pour Vice Versa
date: 2026-08-19
contact: Danaë
linear:
  affaire: https://linear.app/coolbeans-hq/issue/CRM-42
  projet: https://linear.app/coolbeans-hq/project/page-vitrine-vice-versa-52f28a6e9424

sections:
  - titre: Objectif
    texte: >-
      Une page unique pour Vice Versa : tes créations, ton concept, tes
      prochains marchés, un bouton pour commander. **Tu la mets à jour
      toi-même**, quand tu veux, depuis ton ordinateur ou ton téléphone.

  - titre: La page
    texte: "Une seule page, de haut en bas :"
    liste:
      - "En-tête : logo, nom, une phrase"
      - "Tes créations : la galerie"
      - Le concept
      - Prochains marchés
      - "Commander : bouton vers ton formulaire"
      - Témoignages
      - Qui tu es
      - Inscription à ta liste de diffusion
      - Contact direct
      - Mentions légales et confidentialité

  - titre: Fonctionnalités
    liste:
      - >-
        Un CMS pour tout modifier toi-même : photos, textes, dates de
        marchés, adresse du formulaire
      - "Les marchés passés disparaissent de la liste, sans action de ta part"
      - >-
        L'adresse du formulaire est un champ : tu la remplaces à chaque
        renouvellement, sans passer par moi
      - "Inscription à ta liste de diffusion, raccordée à ton outil d'emailing"

  - titre: Quelques recos
    texte: >-
      Pour chacune, dis-moi : on la met, on la garde pour la V2, ou on oublie.
    liste:
      - "Des photos portées. Premier levier de vente en bijou, loin devant le reste."
      - "Un ordre de prix, même approximatif. Sans, on suppose que c'est cher."
      - "Les matériaux. Objection d'achat réelle sur des boucles d'oreilles."
      - "Le délai et le mode de remise : envoi postal ou en main propre sur le marché."
      - "Trois témoignages, avec prénom et photo portée."
      - "Deux phrases sur ta fabrication. Ce qui justifie le prix d'un bijou artisanal."
      - "Le bouton de commande répété après la galerie et après les témoignages."
      - >-
        La liste de diffusion présentée comme un service : « je te préviens
        de mes prochains marchés ».

  - titre: De ton côté
    texte: "Ce qu'il me manque pour chiffrer :"
    liste:
      - "Le nom de domaine, à valider et réserver"
      - "Ton outil d'emailing."
      - >-
        Tes photos : combien, prises par qui ? Leur qualité décidera du
        rendu final, plus que tout le reste.
      - "Un portrait de toi, grand sourire. Pas difficile."
      - "Tes textes : concept, bio, présentation"
      - >-
        Ta maquette, même griffonnée, avec tes typos et ta palette : de quoi
        lancer le moodboard.
      - "Framaforms confirmé ?"
      - "Une date, même approximative. Un premier marché à viser ?"

  - titre: Tonalité
    texte: "Pour cadrer le moodboard, choisis dans chaque paire. Pas de bonne réponse, juste une direction."
    liste:
      - Chaleureux ou froid
      - Épuré ou foisonnant
      - Classique ou audacieux
      - Discret ou affirmé
      - Brut ou raffiné
      - Ludique ou sérieux
    note: >-
      Et si une marque, un objet ou un lieu résume l'esprit de Vice Versa,
      dis-le moi. Ça vaut dix adjectifs.

  - titre: Technique
    texte: "Ce que ça te donne :"
    liste:
      - >-
        Un CMS éprouvé, celui que j'utilise sur tous mes projets clients.
        Tes modifications sont en ligne en quelques secondes.
      - >-
        Aucun abonnement. Hébergement gratuit. Seul frais récurrent : le nom
        de domaine, autour de 15 € par an
      - >-
        Rien à entretenir : pas de mise à jour, pas d'extension, pas de
        faille à corriger dans l'urgence. Contrairement à WordPress.
      - >-
        Tu restes libre : le code t'appartient, ton contenu est exportable,
        n'importe quel développeur peut reprendre la page

  - titre: Budget
    budget:
      enAttente: true
      lignes:
        - label: >-
            Direction visuelle : moodboard et maquette, à partir de ta
            charte et de tes références
        - label: >-
            Intégration et mise en ligne : développement, outil de mise à
            jour, référencement de base, déploiement
        - label: "Agenda des marchés, avec effacement automatique des dates passées"
        - label: "Inscription à ta liste de diffusion, raccordée à ton outil d'emailing"
        - label: "Prise en main : une demi-heure ensemble, plus un guide écrit"
      mention: HT
      reglement: >-
        30 % à la validation du devis, qui lance la prestation. Solde à
        la livraison.

  - titre: Ce que ça comprend
    liste:
      - Responsive (desktop, tablette, mobile)
      - Configuration SEO et bonnes pratiques
      - Optimisation de la vitesse
      - Tests QA sur les 3 navigateurs principaux
      - Setup tracking (analytics sans cookies)
      - Certificat SSL, hébergement et DNS
      - Pages légales et section de contact
      - Doc de passation pour la prise en main du CMS
      - Support 30 jours après mise en ligne

  - titre: Planning
    planning:
      options:
        - label: À partir du démarrage
          indicatif: true
          texte: >-
            Une seule page : compte deux semaines entre le feu vert et la
            mise en ligne, tes allers-retours compris.
          jalons:
            - {
                date: Semaine 1,
                label: "Tu m'envoies photos, textes, charte et ta maquette",
                owner: client,
              }
            - { date: Semaine 1, label: Moodboard et direction visuelle, owner: coolbeans }
            - {
                date: Semaine 1,
                label: "Ton retour et validation de la direction visuelle",
                owner: client,
              }
            - { date: Semaine 1, label: Maquette de la page, owner: coolbeans }
            - { date: Semaine 2, label: Ton retour sur la maquette, owner: client }
            - {
                date: Semaine 2,
                label: "Développement et mise en place du CMS",
                owner: coolbeans,
              }
            - {
                date: Semaine 2,
                label: "Mise en ligne, référencement, prise en main",
                owner: coolbeans,
              }
            - {
                date: Semaine 2,
                label: "Ta relecture, corrections, livraison",
                owner: coolbeans,
              }
          note: >-
            Ces durées supposent que tes photos et tes textes sont prêts au
            démarrage.

notes:
  - tone: success
    texte: >-
      **Tarif d'ami sur l'ensemble.** Le montant sera précisé une fois le
      périmètre arrêté.
  - tone: info
    texte: >-
      Premier jet. J'attends normalement d'avoir toutes les réponses avant
      d'envoyer un devis : là, tu as de quoi te projeter et on l'affine
      ensemble.
  - texte: >-
      La rédaction des textes, la retouche des photos et la création d'un logo
      ne sont pas comprises.
  - texte: >-
      Deux allers-retours sont prévus par livrable. Au-delà, budgété au temps
      passé.
