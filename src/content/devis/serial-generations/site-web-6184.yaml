# Proposition pour le site de Sérial Générations. Affaire CRM-91, projet UNI.
#
# Suite du cadrage publié le 2026-09-10 (cadrage/serial-generations/site-web-3720)
# et complété par Isabelle le 2026-09-11. Deux réponses décident de ce document :
# le budget est en TTC (donc 1 667 € HT de plafond, pas 2 000), et les textes
# existants sont repris tels quels.
#
# Prix : base 2 500 € HT au prix de marché pour un livrable comparable, puis
# remise de 35 % au titre du laboratoire de recherche public. Le motif est un
# statut, antérieur au prix cible, et il n'est vendu nulle part ailleurs dans le
# document comme un bénéfice.
#
# Réécriture complète du 2026-09-11, sur retour de Ludo. Six corrections :
#   - « Sérial'Générations » devient « Sérial Générations ». L'apostrophe vient
#     de la signature de mail d'Isabelle ; le site, lui, écrit le nom en deux
#     mots séparés par une espace, et c'est le nom du projet qui fait foi ;
#   - tous les tooltips supprimés, sans exception ;
#   - plus de « tu » ni de « tes » : le site appartient à un projet collectif,
#     pas à Isabelle. Le document parle du projet et de l'équipe, et s'adresse
#     à « vous » quand il faut nommer un destinataire ;
#   - la note « si l'un de ces points est faux » supprimée ;
#   - les noms de pages passent en gras dans la section « Le site » ;
#   - formulations réécrites en français simple.
#
# « Ce que ça comprend » remis en section propre le 2026-09-11, sur retour de
# Ludo. Il était en note de fin de section, forme reprise du devis Mathilde du
# 2026-09-10 : la skill dit que le YAML le plus récent fait foi, mais
# composition.md décrit ce bloc comme une section standard. Les deux se
# contredisaient, et c'est composition.md qui a raison. Le devis Mathilde porte
# encore la forme en note, à corriger tant qu'il n'est pas envoyé.
#
# Attention : la liste des titres de section est un invariant entre versions.
# Cette proposition n'ayant pas encore été envoyée, l'ajout est sans risque ;
# une fois partie chez Isabelle, cette liste est gelée.
#
# Page Ressources ajoutée au socle le 2026-09-11, décision de Ludo : les liens
# et les PDF annoncés dans son premier mail n'avaient aucune page d'accueil. Le
# socle passe de cinq à six pages, **à prix constant** : son plafond de 2 000 €
# TTC ne laisse que 50 € de marge, donc facturer la page reviendrait à sortir de
# sa fourchette. L'option devient une septième page.
#
# Corrigé au passage : le document affirmait que les PDF se déposent sur Pod.
# C'est faux, Pod ne prend que de la vidéo ; les PDF vont dans Sanity.
#
# Déroulé revu le 2026-09-11, décision de Ludo : à ce prix et à cette date, pas
# d'allers-retours sur la maquette. Un rendez-vous de lancement d'une heure
# remplace la validation de maquette, puis le site se construit d'une traite et
# se présente terminé. La note du planning pose la borne qui va avec : la
# relecture porte sur les contenus, pas sur la direction visuelle. Les étapes
# DNS et recette sont conservées. En échange, Isabelle gagne deux jours de
# réflexion, sa réponse ferme étant attendue au 16 et non plus au 14.
#
# Logo ajouté le 2026-09-11 en note bornée, sans ligne de prix : le socle
# consomme déjà le plafond TTC à 50 € près. Le fichier servi aujourd'hui fait
# 467 x 436 px et Blogger n'en détient pas de plus grand, d'où la demande du
# fichier source dans « De votre côté ». Sans lui, remonter le logo devient un
# redessin, ce que la note exclut explicitement.
#
# Le planning est entièrement refait : Ludo est absent du 28 septembre au
# 2 octobre, ce qui couvrait l'intégralité de l'ancienne fin de calendrier. La
# mise en ligne remonte au vendredi 25 septembre, dernier jour ouvré avant son
# départ, soit huit jours avant les événements du 3 octobre.
titre: Sérial Générations x Coolbeans
objet: Le site du projet
date: 2026-09-11
contact: Isabelle
linear:
  projet: Sérial Générations
  affaire: CRM-91
destinataire:
  societe: Université Paul-Valéry Montpellier 3, laboratoire EPSYLON (EA 4556)
  contact: Isabelle Tournier
  adresse:
    - Site de Saint-Charles
    - Rue du Professeur Henri Serre
    - 34080 Montpellier

sections:
  - titre: Ce que j'ai compris
    texte: >-
      Le site actuel se présente comme un blog, alors que Sérial Générations est
      un projet de recherche financé, porté par une équipe et suivi par des
      partenaires. C'est cet écart qu'il s'agit de corriger.
    liste:
      - texte: >-
          Le menu annonce sept pages. Un seul billet a été publié depuis mai.
      - texte: >-
          Les captations de tables rondes et les micros-trottoirs n'ont
          aujourd'hui aucune place sur le site.
      - texte: >-
          Le site doit rester lisible par le grand public, et pas seulement par
          des universitaires.
      - texte: >-
          L'équipe publie elle-même aujourd'hui, et doit pouvoir continuer.

  - titre: Le site
    texte: >-
      Six pages, contre sept aujourd'hui : deux des pages actuelles fusionnent,
      et une page nouvelle accueille les documents.
    liste:
      - texte: >-
          **Accueil** : ce qu'est Sérial Générations, présenté dans une langue
          accessible à qui n'est pas chercheur.
      - texte: >-
          **Le projet** : le contexte et l'objet d'étude réunis. Ce sont deux
          pages aujourd'hui, et elles disent la même chose.
      - texte: >-
          **L'équipe** : les membres, leur discipline, leur laboratoire.
      - texte: >-
          **Partenaires et financeurs** : les acteurs de l'audiovisuel et du
          secteur culturel d'un côté, les financeurs de l'autre, réunis sur une
          page.
      - texte: >-
          **Ressources** : les documents à télécharger et les liens vers les
          publications et les travaux cités. C'est la page qui manque
          aujourd'hui.
      - texte: >-
          **Actualités** : tables rondes, ateliers, publications. C'est la page
          qui évolue, et l'équipe l'alimente sans intervention extérieure.

  - titre: Les outils
    texte: Deux outils, dont un seul s'ouvre au quotidien.
    liste:
      - texte: >-
          **L'espace de rédaction** : une adresse web et un mot de passe. On y
          ajoute une actualité, un membre de l'équipe, un partenaire ou une
          vidéo, depuis un ordinateur comme depuis un téléphone.
      - texte: >-
          **Les captations** restent sur Pod, l'instance vidéo de l'Université
          Paul-Valéry. Il suffit d'y coller l'adresse d'une vidéo pour qu'elle
          s'affiche dans la page. Les documents PDF, eux, se déposent
          directement dans l'espace de rédaction.
      - texte: >-
          **L'hébergement** est assuré par Cloudflare, sans abonnement à
          renouveler.
    note: >-
      Aucun frais récurrent après la mise en ligne, hormis le nom de domaine,
      qui reste enregistré là où il l'est aujourd'hui.

  - titre: Ce que ça comprend
    liste:
      - Responsive (desktop, tablette, mobile)
      - Configuration SEO et bonnes pratiques
      - Optimisation des web perfs (vitesse, Core Web Vitals…)
      - Tests QA sur les 3 navigateurs principaux
      - Setup tracking (analytics sans cookies)
      - Certificat SSL, hébergement et DNS
      - Pages légales
      - Doc de passation pour la prise en main du CMS
      - Support 30 jours après mise en ligne

  - titre: Le budget
    budget:
      lignes:
        - label: "**Les six pages**, conçues et intégrées"
          prix: 900
        - label: "**L'espace de rédaction**, pour publier sans intermédiaire"
          prix: 850
        - label: "**Les vidéos et les documents**, affichés dans les pages"
          prix: 300
        - label: "La reprise des textes et des images existants"
          prix: 200
        - label: "**Mise en ligne** : nom de domaine, référencement, recette"
          prix: 250
        - label: "Une septième page, en cas de besoin"
          prix: 250
          optionnel: true
          defaut: false
      remises:
        - label: Laboratoire de recherche public
          pct: 35
      mention: HT
      reglement: >-
        Aucun acompte. Le travail démarre dès votre accord, sans attendre le bon
        de commande, et une seule facture est émise à la mise en ligne.
    note: Soit 1 950 € toutes taxes comprises.

  - titre: Le déroulé
    planning:
      options:
        - label: Calendrier
          texte: >-
            Les deux événements de la Fête de la Science ont lieu le samedi
            3 octobre, et je suis absent du 28 septembre au 2 octobre. Le site
            est donc mis en ligne le vendredi 25 septembre, huit jours avant.
            Un rendez-vous d'une heure remplace les allers-retours de maquette :
            la direction visuelle et la structure s'y décident, puis le site est
            construit d'une traite et présenté terminé.
          jalons:
            - { date: "Mer. 16 sept.", label: "Réponse ferme sur la proposition", owner: client }
            - { date: "Jeu. 17 sept.", label: "Rendez-vous de lancement, une heure" }
            - { date: "Ven. 18 au 23 sept.", label: "Conception et construction du site", owner: coolbeans }
            - { date: "Mer. 23 sept.", label: "Site complet, à parcourir avant la mise en ligne", owner: coolbeans }
            - { date: "Jeu. 24 sept.", label: "Relecture et retours", owner: client }
            - { date: "Ven. 25 sept.", label: "Corrections, bascule du nom de domaine et mise en ligne", owner: coolbeans }
            - { date: "28 sept. au 2 oct.", label: "Indisponibilité, aucune intervention possible" }
            - { date: "Sam. 3 oct.", label: "Les deux événements de la Fête de la Science" }
          note: >-
            La relecture du 24 septembre porte sur les contenus et les
            corrections, pas sur la direction visuelle, qui est arrêtée au
            rendez-vous de lancement. Si la réponse arrive après le 16 septembre,
            ou si les décisions doivent passer par l'équipe, la mise en ligne est
            reportée à la semaine du 5 octobre, à mon retour.

  - titre: De votre côté
    texte: Peu de choses, mais ce sont elles qui tiennent la date.
    liste:
      - texte: >-
          Une réponse ferme avant le mercredi 16 septembre.
      - texte: >-
          Une heure de disponibilité pour le rendez-vous de lancement, le jeudi
          17 septembre. C'est le seul moment où la direction visuelle se décide.
      - texte: >-
          L'accès au compte Wix sur lequel le nom de domaine est enregistré, le
          temps de le faire pointer vers le nouveau site. Aucun transfert et
          aucune résiliation ne sont nécessaires.
      - texte: >-
          Une seule personne décisionnaire, désignée à l'avance.
      - texte: >-
          Les corrections sur les textes repris, au moment de la relecture.
      - texte: >-
          Le fichier source du logo. Le seul fichier disponible en ligne
          aujourd'hui mesure 467 pixels de large, ce qui ne suffit pas.
    note: >-
      Une seule relecture est prévue avant la mise en ligne. Le calendrier ne
      permet pas d'en caler une deuxième avant les événements du 3 octobre.

notes:
  - tone: success
    texte: >-
      Remise de 35 % au titre du laboratoire de recherche public. Aucun acompte
      n'est demandé : le travail démarre dès votre accord, sans attendre que le
      bon de commande soit passé.
  - tone: warning
    texte: >-
      Cette proposition suppose un hébergement libre et aucune charte imposée
      par l'université. Si la direction des systèmes d'information impose son
      propre hébergement, ou si une mise en conformité RGAA est exigée, ces
      points font l'objet d'un avenant.
  - texte: >-
      Les réseaux sociaux ne sont pas dans le périmètre. Le site est préparé
      pour qu'un partage sur Facebook ou Instagram s'affiche avec son titre, son
      texte et son image, mais l'ouverture des comptes et leur animation restent
      à la charge du projet.
  - texte: >-
      La rédaction des textes et la fourniture des visuels ne sont pas incluses.
  - texte: >-
      Le logo existant est remonté en format horizontal pour l'en-tête, à partir
      de son fichier source. Redessiner le logo ou en créer un nouveau n'entre
      pas dans le périmètre.
  - texte: Proposition valable 30 jours.
